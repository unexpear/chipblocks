# Continuous-integration checks. Runs on every push and PR to master.
#
# ChipBlocks v2 (ground-up restart): the CI surface is intentionally
# minimal at this stage — just TypeScript-check + npm install validity
# on the empty shell. Backend pytest + codegen-drift checks + frontend
# vitest will be added back as the new direction grows them in the
# coming sprints.
#
# The legacy/audio-synth-direction branch retains its own (richer) CI
# config; this file only applies to master and PRs to it.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  frontend:
    name: Frontend (install + typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit
