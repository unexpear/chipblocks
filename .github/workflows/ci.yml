# Continuous-integration checks: TypeScript build, frontend tests,
# backend tests. Runs on every push and PR to master. Fast (~3 min),
# Linux-only — the cross-platform installer build lives in release.yml
# and only fires on tag push.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  frontend:
    name: Frontend (TS + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Vitest
        run: npm test

      # Sprint 21 — ADR-003 block-manifest codegen drift check. Re-runs
      # scripts/codegen-frontend.mjs in --check mode (default). Fails if
      # any of the 5 generated frontend sections (index.ts / busTypes.ts
      # / Palette.tsx / App.css / ai/prompt.ts) drifts from what
      # blocks.yaml says it should be. The script exits non-zero with a
      # unified diff if drift is found — actionable in the PR view.
      - name: Codegen drift check (frontend)
        working-directory: .
        run: node scripts/codegen-frontend.mjs --check

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install runtime + dev dependencies
        run: |
          pip install --upgrade pip
          # amaranth-yosys is the PyPI Yosys fallback used by
          # amaranth.back.verilog.convert() when no system yosys is
          # on PATH. Required for test_tinytapeout.py's bundle-shape
          # tests which invoke the full Verilog emit path.
          pip install amaranth==0.5.8 amaranth-yosys pyyaml==6.0.2
          pip install -r requirements-dev.txt

      - name: Pytest
        run: python -m pytest tests/ -v

      # Sprint 21 — ADR-003 block-manifest codegen drift check (backend).
      # Mirror of the frontend codegen-drift step: re-runs
      # scripts/codegen-backend.py and fails if backend/blocks/__init__.py
      # (imports + BLOCK_REGISTRY + __all__) or backend/blocks/_params_gen.py
      # drifts from what blocks.yaml says it should be.
      - name: Codegen drift check (backend)
        working-directory: .
        run: python3 scripts/codegen-backend.py
