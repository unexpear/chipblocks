# Continuous-integration checks. Runs on every push and PR to master.
#
# ChipBlocks v2 (ground-up restart). At Sprint 2 the CI gates expand
# from just TS check to: npm install + tsc + vitest + codegen-drift.
# Manifest authoring + tests grow this surface back as features
# return; the legacy/audio-synth-direction branch retains its own
# (richer) CI config.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  frontend:
    name: Frontend (install + typecheck + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Vitest
        run: npm test

      # S2-7 onward — manifest codegen drift check. Runs
      # scripts/codegen-manifests.mjs in --check mode (default). Fails
      # the PR if any generated TS registry in
      # frontend/src/manifests/_generated/ is out of sync with its
      # source YAML manifest at repo root. Run `npm run codegen:write`
      # locally to regenerate after editing a manifest.
      - name: Codegen drift check
        run: npm run codegen
