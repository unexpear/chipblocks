# ChipBlocks block manifest — single source of truth for cross-cutting
# block metadata. Per ADR-003, this file is authored by hand and read by
# scripts/codegen-frontend.mjs + scripts/codegen-backend.py to produce
# the registries and tables in the cross-cutting target files.
#
# Order matters: it is the same order used by frontend/src/Palette.tsx's
# PALETTE array. Codegen produces palette entries in this sequence.

- type: oscillator
  label: Oscillator
  description: Square wave source
  color: '#4caf50'
  category: source
  componentPath: frontend/src/blocks/OscillatorNode.tsx
  backendPath: backend/blocks/oscillator.py
  backendClass: Oscillator
  ports:
    audio-out: { dir: source, bus: audio-s8 }
  parameters:
    freq:
      type: int
      min: 20
      max: 20000
      default: 440
      ariaLabel: Frequency in hertz
      unit: Hz
      backendParam: freq_hz
      backendNeedsSampleRate: true
  tags: []

