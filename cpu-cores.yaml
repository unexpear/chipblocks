# ChipBlocks CPU cores manifest. See ADR-005 + ADR-004 (packaged CPU
# representation, draft pending).
#
# This manifest is intentionally empty in Phase 0. ADR-004 lands in
# Sprint 29 along with the first row (picorv32 as the canonical RISC-V
# option, ISC-licensed, ~750 LUTs on iCE40HX8K). Subsequent rows: vexriscv
# (more performant RISC-V), neorv32 (microcontroller-shaped RISC-V),
# possibly mos6502 (retro micro for educational chips). Each new row is
# 1 entry here + 1 wrapper in backend/cpu_cores/<id>/.
#
# The schema enforces conformance to a versioned CPU socket
# (chipblocks-cpu-socket-vN) so any block library knows how to wire a
# CPU to peripherals consistently.

