# ChipBlocks memory backends manifest. See ADR-005.
#
# This manifest is intentionally empty in Phase 0. First row
# (ice40-bram-4kb) lands in Sprint 26 alongside the bus-protocol work
# — making the existing RAM block's iCE40-BRAM-flavored implementation
# explicit and pluggable. The current RAM block in blocks.yaml today
# implicitly targets iCE40 BRAM via Amaranth's inferred-memory inference;
# this manifest will give it an explicit memory-backend FK so a
# Standard-tier ASIC design can opt into a SkyWater SRAM macro instead.
#
# Future rows: sky130-sram-1kb (SkyWater SRAM macro for ASIC tier),
# external-spi-flash (driven by our S26 SPI master), external-spi-dram
# (smartwatch-class external RAM via SPI), and possibly a register-file
# variant for tiny LUT-based scratch storage.

