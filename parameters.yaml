# ChipBlocks default Active Variables. Per ADR-007.
#
# These ~28 variables ship with every new ChipBlocks project as a
# starting set. Users can override any value (the original source +
# value travel in previous_source / previous_value for audit), and
# users can add their own variables freely (source: user_supplied,
# minimal required fields).
#
# Sprint 2 rule (per ADR-007 + CLAUDE.md core principle 2):
#   Built-in defaults must be useful, cited, and condition-aware.
#   User/project values can be rough, but must be typed and unit-valid.
#
# Citation conventions: standards bodies (NIST/IEC/JEDEC/IPC) preferred;
# specific URLs where applicable; values cross-checked.

variables:

  # ───────────────────────── Environmental & physical constants ───────────────

  ambient_temperature:
    type: quantity
    domain: thermal
    value: 25
    units: degC
    scope: simulation
    active: true
    description: "Standard office/lab ambient temperature for thermal checks. Override per project for non-standard environments (outdoor, automotive, industrial)."
    source:
      type: standard
      label: "Standard controlled-climate temperature"
      citation: "IEC 60721-3-3 Class 3K3 (controlled-climate indoor environment); matches typical datasheet conditions"
    confidence: high
    used_by: []
    validation: { status: pass, issues: [] }

  gravity_acceleration:
    type: quantity
    domain: mechanical
    value: 9.80665
    units: m_per_s2
    scope: project
    active: true
    description: "Standard gravitational acceleration at sea level."
    source:
      type: standard
      label: "Standard gravity g0"
      citation: "NIST CODATA 2018; SI-defining constant"
    confidence: high
    used_by: []
    validation: { status: pass, issues: [] }

  sea_level_pressure:
    type: quantity
    domain: mechanical
    value: 101325
    units: Pa
    scope: project
    active: true
    description: "Standard atmospheric pressure at sea level."
    source:
      type: standard
      label: "Standard atmosphere"
      citation: "ISO 2533 standard atmosphere"
    confidence: high
    used_by: []
    validation: { status: pass, issues: [] }

  relative_humidity_default:
    type: quantity
    domain: thermal
    value: 50
    units: pct
    scope: simulation
    active: true
    description: "Default ambient relative humidity for envelope conditions checks."
    source:
      type: standard
      label: "Common indoor RH"
      citation: "IEC 60721-3-3 Class 3K3"
    confidence: medium
    used_by: []
    validation: { status: pass, issues: [] }

  vacuum_permittivity:
    type: quantity
    domain: electrical
    value: 8.8541878128e-12
    units: F_per_m
    scope: project
    active: true
    description: "Permittivity of free space (epsilon_0)."
    source:
      type: standard
      label: "Vacuum permittivity"
      citation: "NIST CODATA 2018"
    confidence: high
    used_by: []
    validation: { status: pass, issues: [] }

  vacuum_permeability:
    type: quantity
    domain: electrical
    value: 1.25663706212e-6
    units: H_per_m
    scope: project
    active: true
    description: "Permeability of free space (mu_0)."
    source:
      type: standard
      label: "Vacuum permeability"
      citation: "NIST CODATA 2018"
    confidence: high
    used_by: []
    validation: { status: pass, issues: [] }

  boltzmann_constant:
    type: quantity
    domain: thermal
    value: 1.380649e-23
    units: J_per_K
    scope: project
    active: true
    description: "Boltzmann constant (k_B). SI-defining constant since 2019."
    source:
      type: standard
      label: "Boltzmann constant"
      citation: "NIST CODATA 2018; SI-defining constant"
    confidence: high
    used_by: []
    validation: { status: pass, issues: [] }

  elementary_charge:
    type: quantity
    domain: electrical
    value: 1.602176634e-19
    units: C
    scope: project
    active: true
    description: "Elementary charge (e). SI-defining constant since 2019."
    source:
      type: standard
      label: "Elementary charge"
      citation: "NIST CODATA 2018; SI-defining constant"
    confidence: high
    used_by: []
    validation: { status: pass, issues: [] }

  # ───────────────────────── Common electrical defaults ─────────────────────

  default_supply_5v:
    type: quantity
    domain: electrical
    value: 5.0
    units: V
    scope: project
    active: true
    description: "USB nominal Vbus / common 5V rail."
    source:
      type: standard
      label: "USB 2.0 nominal Vbus"
      citation: "USB-IF USB 2.0 specification, section 7.2.4"
    conditions:
      load_current: { value: 0, units: mA }
    confidence: high
    tolerance: { min: 4.75, max: 5.25, distribution: uniform }
    used_by: []
    validation: { status: pass, issues: [] }

  default_supply_3v3:
    type: quantity
    domain: electrical
    value: 3.3
    units: V
    scope: project
    active: true
    description: "Common 3.3V logic rail."
    source:
      type: standard
      label: "JEDEC low-voltage TTL logic standard"
      citation: "JEDEC JESD8C low-voltage interface standard"
    confidence: high
    tolerance: { min: 3.0, max: 3.6, distribution: uniform }
    used_by: []
    validation: { status: pass, issues: [] }

  default_supply_1v8:
    type: quantity
    domain: electrical
    value: 1.8
    units: V
    scope: project
    active: true
    description: "Common 1.8V rail (modern logic, LPDDR memory)."
    source:
      type: standard
      label: "JEDEC LVCMOS / LPDDR rail standard"
      citation: "JEDEC JESD8-7A"
    confidence: high
    tolerance: { min: 1.7, max: 1.9 }
    used_by: []
    validation: { status: pass, issues: [] }

  default_supply_9v:
    type: quantity
    domain: electrical
    value: 9.0
    units: V
    scope: project
    active: true
    description: "Nominal 9V alkaline battery (PP3 / E-block / 6LR61). Open-circuit voltage at full state of charge."
    source:
      type: standard
      label: "9V alkaline battery nominal voltage"
      citation: "ANSI/IEC 60086-2 nominal; PP3 / E-block form factor (designation 6LR61)"
    conditions:
      state_of_charge: full
      load_current: { value: 0, units: mA }
      temperature: { value: 20, units: degC }
    confidence: high
    tolerance: { min: 8.4, max: 9.6, distribution: uniform }
    notes: "Open-circuit nominal. Real voltage drops to ~7.5V at 50% SOC under typical 50 mA load. For drained-battery worst-case design, override to 7.5V."
    used_by: []
    validation: { status: pass, issues: [] }

  default_supply_12v:
    type: quantity
    domain: electrical
    value: 12.0
    units: V
    scope: project
    active: true
    description: "Common 12V rail (automotive, bench supplies, industrial)."
    source:
      type: standard
      label: "12V automotive electrical system"
      citation: "ISO 16750-2 (Road vehicles — Environmental conditions and testing for electrical and electronic equipment — Part 2: Electrical loads); supplemented by ISO 7637-2 (electrical transient disturbances)"
    confidence: high
    tolerance: { min: 11.0, max: 14.4 }
    notes: "Automotive 'nominal 12V' is actually 12.6V (lead-acid full) to 14.4V (alternator charge). For battery-only contexts override to 12.6V. ISO 16750-2 defines the normal operating voltage range; ISO 7637-2 covers transients."
    used_by: []
    validation: { status: pass, issues: [] }

  ground_potential:
    type: quantity
    domain: electrical
    value: 0.0
    units: V
    scope: project
    active: true
    description: "Ground reference potential. By definition."
    source:
      type: standard
      label: "Reference ground potential"
      citation: "Convention: ground = 0V; all other voltages relative"
    confidence: high
    used_by: []
    validation: { status: pass, issues: [] }

  target_max_led_current:
    type: quantity
    domain: electrical
    value: 20
    units: mA
    scope: project
    active: true
    description: "Typical max sustained forward current for 5mm through-hole LEDs. Used as a check threshold for LED-protection circuits."
    source:
      type: datasheet
      label: "Common 5mm THT LED maximum forward current"
      citation: "Cree LR series + Kingbright L-7113 family + OSRAM LH P477 datasheets"
    conditions:
      temperature: { value: 25, units: degC }
    confidence: medium
    tolerance: { min: 10, max: 30 }
    notes: "Surface-mount LEDs vary (5mA-100mA). For high-brightness LEDs override; for typical indicator LEDs 20mA is the right ceiling. The Sprint 6 demo (LED + resistor + switch + power source) uses this default."
    used_by: []
    validation: { status: pass, issues: [] }

  safety_derating_factor:
    type: quantity
    domain: meta
    value: 0.8
    units: dimensionless
    scope: project
    active: true
    description: "Safety derating fraction. Apply to rated maximums (current, voltage, power) to leave headroom for tolerance, temperature drift, and aging."
    source:
      type: reference
      label: "Common engineering derating practice"
      citation: "MIL-HDBK-217F + commercial industry practice; commonly 0.5 to 0.8"
    confidence: medium
    tolerance: { min: 0.5, max: 0.9 }
    notes: "Conservative designs use 0.5; commercial / high-confidence designs use 0.8-0.9. Sprint 2 default is 0.8."
    used_by: []
    validation: { status: pass, issues: [] }

  # ───────────────────────── PCB / board defaults (used Phase 3+) ────────────

  default_pcb_substrate:
    type: enum
    domain: manufacturing
    value: FR4
    allowed: [FR4, polyimide, alumina_ceramic, Rogers_4350B, Isola_I-Tera]
    scope: release
    active: true
    description: "Default PCB substrate material for new designs."
    source:
      type: standard
      label: "Standard general-purpose PCB substrate"
      citation: "IPC-4101/126; industry default for 1-4 layer general-purpose boards"
    confidence: high
    used_by: []
    validation: { status: pass, issues: [] }

  default_copper_weight:
    type: quantity
    domain: manufacturing
    value: 1.0
    units: oz_per_ft2
    scope: release
    active: true
    description: "Default PCB copper weight (thickness in oz per square foot)."
    source:
      type: standard
      label: "IPC reference copper geometry"
      citation: "IPC-2152 reference; 1 oz/ft^2 = ~35 um thickness"
    confidence: high
    tolerance: { min: 0.5, max: 4.0 }
    notes: "Use 0.5 oz for fine-pitch impedance-controlled traces, 2-4 oz for high-current power planes."
    used_by: []
    validation: { status: pass, issues: [] }

  default_pcb_layer_count:
    type: quantity
    domain: manufacturing
    value: 2
    units: count
    scope: release
    active: true
    description: "Default PCB layer count for new designs."
    source:
      type: community
      label: "Common hobbyist/prototype default"
      citation: "JLCPCB / OSHPark / dirtypcbs typical 2-layer baseline"
    confidence: medium
    used_by: []
    validation: { status: pass, issues: [] }

  default_trace_width_min:
    type: quantity
    domain: manufacturing
    value: 0.15
    units: mm
    scope: release
    active: true
    description: "Minimum trace width per the default PCB fab's design rules."
    source:
      type: community
      label: "JLCPCB / OSHPark 2-layer minimum trace width"
      citation: "JLCPCB capability matrix 2026; OSHPark design rules"
    confidence: high
    notes: "6 mil (0.15 mm) is JLCPCB / OSHPark 2-layer minimum. Tighter (4 mil = 0.10 mm) available at additional cost."
    used_by: []
    validation: { status: pass, issues: [] }

  default_via_drill_min:
    type: quantity
    domain: manufacturing
    value: 0.3
    units: mm
    scope: release
    active: true
    description: "Minimum via drill diameter per the default PCB fab's design rules."
    source:
      type: community
      label: "JLCPCB / OSHPark 2-layer minimum via drill"
      citation: "JLCPCB capability matrix 2026; OSHPark design rules"
    confidence: high
    used_by: []
    validation: { status: pass, issues: [] }

  # ───────────────────────── Solder / assembly defaults ─────────────────────

  default_solder_alloy:
    type: enum
    domain: manufacturing
    value: solder_sn63pb37
    allowed: [solder_sn63pb37, solder_sac305]
    scope: release
    active: true
    description: "Default solder alloy for assembly. Sn63Pb37 (leaded eutectic) for hobby/repair/industrial; SAC305 (lead-free SnAgCu) for RoHS-compliant consumer."
    source:
      type: standard
      label: "Default solder choice"
      citation: "IEC 61190-1-3; user-overridable per market regulations"
    confidence: high
    notes: "Override to solder_sac305 for EU/UK/RoHS-compliant new designs. The materials.yaml entries provide full provenance for each alloy."
    used_by: []
    validation: { status: pass, issues: [] }

  default_reflow_peak_temp:
    type: quantity
    domain: manufacturing
    value: 215
    units: degC
    scope: release
    active: true
    description: "Reflow oven peak temperature for SMT assembly (leaded process)."
    source:
      type: standard
      label: "Leaded process reflow peak"
      citation: "IPC J-STD-020 Table 4-1 + Table 4-2 (Class 2 leaded)"
    conditions:
      solder_alloy: solder_sn63pb37
    confidence: high
    notes: "For SAC305 / lead-free, override to 245-250 °C peak (per IPC J-STD-020 Table 5-2)."
    used_by: []
    validation: { status: pass, issues: [] }

  # ───────────────────────── Feature flags ─────────────────────────────────

  enable_thermal_derating:
    type: bool
    domain: meta
    value: true
    scope: project
    active: true
    description: "Enable temperature-based derating warnings during validation."
    source:
      type: user_supplied
      label: "Conservative engineering practice — default on"
    confidence: high
    used_by: []
    validation: { status: pass, issues: [] }

  enable_eos_warnings:
    type: bool
    domain: meta
    value: true
    scope: project
    active: true
    description: "Enable electrical-overstress warnings (component voltage / current / power exceeding ratings)."
    source:
      type: user_supplied
      label: "Conservative engineering practice — default on"
    confidence: high
    used_by: []
    validation: { status: pass, issues: [] }

  treat_unconfirmed_components_as_warning:
    type: bool
    domain: meta
    value: true
    scope: project
    active: true
    description: "If true, blocks without a confirmed datasheet citation produce a warning (not pass). Conservative."
    source:
      type: user_supplied
      label: "Conservative engineering practice — default on"
    confidence: high
    used_by: []
    validation: { status: pass, issues: [] }
