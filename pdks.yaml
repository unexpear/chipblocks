# ChipBlocks PDK manifest. See ADR-005.
#
# One row per process node + cell library combination. Phase 0 has just
# sky130A — the PDK used by the existing Tiny Tapeout slot. Future rows:
# gf180mcuB (GlobalFoundries 180 nm open PDK, BCD process variant with
# strong analog support — good candidate for the S31 radio path),
# ihp-sg13g2 (IHP 130 nm open PDK with SiGe BiCMOS — also analog-strong).
# Each new row arrives with one ChipBlocks-side adapter at backend/pdks/
# <id>.py and is then referenceable from shuttles.yaml.

- id: sky130A
  label: "SkyWater 130 nm Open PDK (variant A)"
  vendor: SkyWater
  feature_size_nm: 130
  cell_library: sky130_fd_sc_hd
  cell_library_path: "$(PDK_ROOT)/sky130A/libs.ref/sky130_fd_sc_hd/verilog/"
  pdk_root_env: PDK_ROOT
  default_pnr_tool: openlane
  default_density_target: 0.55
  open_source_license: "Apache-2.0"
  analog_capable: true
  notes: |
    The PDK most ChipBlocks users will encounter (via Tiny Tapeout's
    eFabless shuttle). High-density 130 nm standard cells. Ships BJT
    + diode models suitable for the analog frontend of an OOK
    transmitter (planned S31). Has been the open-PDK reference since
    Google + SkyWater released it in 2020.
