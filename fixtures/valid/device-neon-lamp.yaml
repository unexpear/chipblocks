# Valid fixture: neon / gas-discharge lamp — a glass tube of low-pressure gas (neon for the orange
# glow lamp; mercury vapour for a fluorescent tube). Neon was isolated by Ramsay & Travers in 1898;
# Georges Claude built the first neon lamps and signs (~1910). The tiny NE-2 neon glow lamp became
# the ubiquitous indicator and the textbook relaxation-oscillator element.
#
# It is the SAME latching gas discharge as the carbon arc, just at neon voltages and currents and
# with a cool glow instead of a blinding crater:
#   1. it must STRIKE — the cold gas is an insulator, so nothing flows until the voltage reaches the
#      striking (breakover) voltage (~90 V for an NE-2), when the gas ionizes into a glow; and
#   2. once lit it holds at a lower MAINTAINING voltage (~60-65 V) and LATCHES on, glowing until the
#      current drops below a holding current (~0.1 mA). The strike-above-maintain gap is a hysteresis
#      — a neon across a charging capacitor flashes, dumps the cap and re-charges, a relaxation
#      oscillator. Like every gas discharge it cannot limit its own current, so it needs a BALLAST.
#
# Modeled exactly like the arc lamp — the Shockley strike/hold latch (device_state, settled in
# solveWithRelays: strike at breakover_voltage, hold above holding_current) plus a fixed maintaining-
# voltage drop once struck (dc-solver.ts stampArc), the external ballast setting the current. The
# light is luminous_efficacy times the discharge power (light.ts arcLuminousFluxLumens) — a neon
# indicator is dim, but a FLUORESCENT tube is the same glow discharge in mercury vapour whose
# ultraviolet light excites a phosphor coating to make efficient white light (model it with a higher
# luminous_efficacy, ~60 lm/W vs neon's ~0.5).
#
# Honest scope: a constant maintaining voltage (the slight negative-resistance fall is the documented
# next rung); the strike is a voltage threshold; the relaxation oscillator + AC operation now run in
# the transient latch (a neon across an RC flashes); the phosphor + the neon/mercury gas fills
# are an efficacy/colour choice, not yet catalog materials (the electrodes are a copper stand-in).
#
# MUST validate against definition.schema.json.
kind: primitive_device
id: neon_lamp
origin: builtin
layer: primitive_device
name: "Neon lamp (gas discharge)"
description: "A neon / gas-discharge lamp (Claude, ~1910). The cold gas is an insulator until the striking voltage ionizes it into a glow; it then holds at a lower maintaining voltage and LATCHES on until the current drops below its holding current. The strike-above-maintain hysteresis makes it a relaxation oscillator with a resistor + capacitor, and like every discharge it needs a series ballast. Modeled as the Shockley strike/hold latch plus a fixed maintaining-voltage drop once struck; the light is the luminous efficacy times the discharge power. A fluorescent tube is the same discharge plus a phosphor coating (whiter and far more efficient)."
composition:
  requires:
    electrodes:
      kind: material
      must_enable:
        - electrical_conduction
    endpoints:
      kind: interface
      min_count: 2
parameters:
  electrodes:
    type: material_ref
    satisfies_role: electrodes
    required: true
    default:
      value: copper
    description: The discharge electrodes. Real lamps use iron or nickel; the catalog's copper stands in. The active medium is the neon (or mercury-vapour) gas fill, not yet a catalog material — the discharge physics comes from the parameters.
  maintaining_voltage:
    type: quantity
    units: volt
    required: true
    description: The near-constant voltage the struck glow holds (a neon glow sustains ~60-65 V). Stamped as a fixed drop once struck, the ballast setting the current.
  breakover_voltage:
    type: quantity
    units: volt
    required: true
    description: The striking (ignition) voltage — the gas stays dark until at least this appears across it, then breaks down into a glow. Higher than the maintaining voltage, which is what makes the neon relaxation oscillator possible.
  holding_current:
    type: quantity
    units: ampere
    required: true
    description: The minimum current that sustains the glow. Below it the discharge collapses and the lamp goes dark (the latch turns off).
  max_current:
    type: quantity
    units: ampere
    required: false
    description: The electrode current rating. Above it the electrodes sputter and the lamp blackens — the symptom of too small a ballast.
  luminous_efficacy:
    type: quantity
    units: lm/W
    required: false
    description: Light produced per watt of discharge power. A neon indicator is dim (~0.5 lm/W); a fluorescent tube (the same discharge plus a phosphor) reaches ~60 lm/W.
  device_state:
    type: enum
    required: false
    allowed:
      - blocking
      - conducting
    description: The latch state — blocking (dark, an open) or conducting (struck, glowing). Starts blocking; the discrete-state solve strikes it at breakover_voltage and extinguishes it below holding_current.
behaviors:
  - emits_light
  - conducts_current
  - produces_joule_heat
terminals:
  anode:
    description: The + electrode. In a DC lamp the negative electrode is the one that glows; on AC both glow. Current in here.
  cathode:
    description: The - electrode. Current returns here.
support:
  model_status: defined
  solver_status: builtin_simple
extensions:
  overridable: true
  user_extensible: true
  allowed_origins: [builtin, community, user_local, project]
notes: |
  The strike + hold are the Shockley/SCR bistable latch (shockley-diode.ts LATCHING_THYRISTORS),
  shared with the carbon arc lamp: device_state flips in the discrete-state fixed point
  (solveWithRelays) — blocking -> conducting at breakover_voltage (the striking voltage), and
  conducting -> blocking when the current drops below holding_current. A CONDUCTING lamp is stamped as
  a fixed maintaining_voltage drop anode -> cathode (dc-solver.ts stampArc, the same fixed-drop
  mechanism the arc and the LED use), so the external ballast sets the current; a DARK lamp is an open.
  Light = luminous_efficacy * maintaining_voltage * current (light.ts arcLuminousFluxLumens). Honest
  scope: a constant maintaining voltage (the slight negative-resistance fall is the next rung); the
  strike is a voltage threshold; the relaxation oscillator + AC operation run in the transient latch
  (a neon across an RC flashes); a fluorescent tube is the same discharge with a phosphor
  (model it by a higher efficacy); the gas fills + phosphor are not yet catalog materials and the
  electrodes are a copper stand-in. Sources: Ramsay & Travers (neon, 1898); Georges Claude (neon
  lamps / signs, ~1910); standard glow-discharge physics (Cobine, "Gaseous Conductors").
