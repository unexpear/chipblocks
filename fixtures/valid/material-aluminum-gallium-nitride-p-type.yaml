# Valid fixture: material definition for p-doped Aluminum Gallium Nitride (AlGaN).
# The p-side counterpart to material-aluminum-gallium-nitride-n-type.
#
# p-type doping via magnesium acceptors. AlGaN inherits the InGaN/GaN
# p-doping problem and makes it WORSE at high Al fractions. The Mg acceptor
# level deepens from ~170 meV in pure GaN to ~500-600 meV in pure AlN,
# rendering p-type doping essentially non-functional at deep-UV compositions.
# Practical p-AlGaN is limited to moderate Al fractions (x <= ~0.3) for
# functional devices.
#
# This is THE central manufacturing challenge for high-efficiency deep-UV
# LEDs. Modern research uses tricks like polarization-induced doping,
# AlGaN/GaN superlattices, or Mg-delta doping to work around the deep-acceptor
# limitation, but quantum efficiency at deep UV stays below ~10 percent.
#
# Used by: future UV LED p_side. The `led_uv_algan` separate device will
# carry lifetime + eye-safety + Al-fraction parameters that reflect these
# constraints.
# MUST validate against definition.schema.json.
