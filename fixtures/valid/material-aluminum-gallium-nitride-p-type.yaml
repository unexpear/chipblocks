name: "AlGaN, p-type (Al_x Ga_{1-x} N doped p-type)"
description: "Wide-bandgap III-nitride compound semiconductor doped p-type with magnesium acceptors. Same Al-fraction-tunable direct bandgap as the n-type variant (3.4 eV pure GaN to 6.0 eV pure AlN). Holes are the majority carrier in principle, but Mg acceptor activation collapses at high Al fractions — practical p-AlGaN devices are limited to Al fractions below ~0.3, which restricts the wavelengths reachable to UV-A and the longer-wavelength end of UV-B. This is the fundamental reason deep-UV LED efficiency stays low."
