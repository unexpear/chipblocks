notes: |
  p-AlGaN is the hardest of the III-nitride p-type problems. The Mg acceptor
  level deepens roughly linearly with Al fraction: ~170 meV at x = 0 (pure
  GaN), ~500-600 meV at x = 1 (pure AlN). Above x ~ 0.5 the material is
  effectively a wide-bandgap insulator regardless of Mg dopant concentration.
  Industry workarounds for deep-UV LED p-contacts:
  - Polarization-induced doping (using AlGaN composition grading to generate
    free holes via fixed-charge polarization fields)
  - AlGaN/GaN superlattices (alternating thin AlGaN + GaN layers tunneling-
    couple Mg activation across the AlGaN cladding)
  - Mg delta-doping in thin layers
  - p-GaN contact layer on AlGaN active region (asymmetric structure)
  These tricks improve but do not solve the fundamental problem. Modern deep-
  UV LEDs (e.g., 280 nm sterilization wavelength) achieve EQE around 5-10
  percent compared to >50 percent for blue InGaN.
  Lifetime: deep-UV LED lifetime (L70) is typically 1,000-10,000 hours,
  compared to 50,000+ hours for blue InGaN — a real reliability gap that the
  led_uv_algan device's parameters will reflect when it lands.
extensions:
