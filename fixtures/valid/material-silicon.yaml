# Valid fixture: material definition for intrinsic silicon.
# Foundational semiconductor — undoped. Doped Si (n-type / p-type) is a separate concern
# that lands when transistors/diodes arrive (Sprint 5+).
#
# Intrinsic silicon does NOT enable electrical_conduction — its room-temperature resistivity
# is ~11 orders of magnitude higher than copper. It conducts negligibly without doping.
# When doping arrives, doped-silicon variants will be separate material definitions that
# DO enable electrical_conduction.
#
# MUST validate against definition.schema.json.
kind: material
id: silicon
origin: builtin
layer: material
name: Silicon (Si, intrinsic)
description: Group IV semiconductor element. The foundational material of modern integrated circuits. This entry is intrinsic (undoped) silicon — essentially insulating at room temperature. Doped variants (n-type, p-type) arrive when transistors and diodes are introduced.
composition:
  uses: []
enables:
  - thermal_conduction
