# Valid fixture: three-phase induction motor with a TRUE three-phase hookup - three phase ports
# plus the wye star point brought out (like a six-terminal machine wired in star). Where the
# two-terminal sibling (induction_motor) carries one phase and synthesizes the other two, THIS
# machine takes all three on real wires - so everything a real three-phase line does to a real
# motor happens here because the physics makes it happen, not because it was coded:
#   - a balanced positive-sequence supply spins it up forward onto the Steinmetz operating point;
#   - SWAP ANY TWO LEADS and the field sequence reverses - the motor runs BACKWARD (the classic
#     electrician's reversal, and the classic accident);
#   - LOSE A PHASE (single-phasing) and the field stops rotating at standstill - the developed
#     starting torque is exactly zero, a loaded machine cannot start, and the solver names it;
#   - an unbalanced or off-frequency supply is marched as-is, no nameplate assumption.
#
# Modeled by the same dq (stationary-reference-frame) dynamic model as the sibling
# (induction-motor-dq.ts): stator + rotor flux linkages, the zero-sequence current, and the rotor
# speed as states; trapezoidal flux march; J*domega/dt = T_e - B*omega - T_load. The Clarke
# alpha/beta components of the winding voltages are common-mode invariant, so they read straight
# off the phase terminals and the machine needs no internal star node; an UNWIRED port (the
# floating star of a 3-wire hookup, or an open phase) is eliminated exactly by its zero-current
# condition - the textbook open-terminal reduction, verified against the phasor solution.
#
# Honest scope: the stator connects in WYE (star point on the neutral terminal - wire it for a
# 4-wire hookup, leave it unwired for the common 3-wire machine with its floating star) or in
# DELTA (stator_connection parameter - each winding across a line pair, no star point; the same
# coils then see the full line-to-line voltage, giving ~3x the starting torque and line current,
# the physics behind wye-delta starters; internally the delta is referred to its exact
# equivalent wye, winding impedances / 3). At DC a wye phase-to-neutral loop sees exactly one
# winding R1 and a line-to-line loop two in series (2*R1); a delta line-to-line loop sees one
# winding in parallel with the other two in series (2/3 of a winding) - the DC solver's stamp
# and the transient's settled limit agree in every hookup. Magnetic saturation (opt-in via the
# magnetization-curve params), deep-bar/skin effect (opt-in via the second rotor cage,
# rotor_resistance_2 + rotor_reactance_2 - two real rotor circuits per axis, the strong-starting
# NEMA design B/C rotor) and core loss (opt-in via core_loss_resistance - iron loss on a
# resistance in parallel with the magnetizing branch) are all modeled, as on the sibling;
# self-heating is unmodeled. Without a rotor_inertia the rotor is held at the nameplate operating
# speed (quasi-static) and the solver says so.
#
# MUST validate against definition.schema.json.
kind: primitive_device
id: induction_motor_three_phase
origin: builtin
layer: primitive_device
name: "AC induction motor (3-phase supply)"
description: "A three-phase squirrel-cage induction motor with a true three-phase hookup - phase A, B and C ports plus the wye star point. All three phases arrive on real wires, so the real machine's behaviors emerge from the physics - swap any two leads and it runs backward; lose a phase and it cannot start from rest (single-phasing, named by the solver); drive it unbalanced or off-frequency and the waveforms are marched as-is. Given a rotor inertia it genuinely spins up from rest, drawing the locked-rotor inrush that tapers onto the steady operating point the readings show."
composition:
  requires:
    winding:
      kind: material
      must_enable:
        - electrical_conduction
    endpoints:
      kind: interface
      min_count: 3
parameters:
  winding:
    type: material_ref
    satisfies_role: winding
    required: true
    default:
      value: copper
    description: The conductor the stator is wound from. Must conduct; copper is the standard.
  stator_connection:
    type: enum
    required: false
    allowed:
      - wye
      - delta
    description: "How the three stator windings are connected - wye (star, the default; the star point is the neutral terminal) or delta (each winding across a line pair; no star point, so the neutral terminal is not connected). The impedance parameters below are per WINDING either way. The same coils in delta see the full line-to-line voltage instead of a 1/sqrt(3) share - about 3x the starting torque and 3x the line current, which is exactly why wye-delta STARTERS exist: start in wye (gentle), run in delta (full torque). Internally a delta is referred to its exact equivalent wye (every winding impedance / 3, the textbook transform, exact for identical windings at any excitation)."
  supply_voltage:
    type: quantity
    units: volt
    required: true
    description: The LINE's phase-to-neutral RMS nameplate voltage - for a 400 V three-phase line enter 230 V. This is still the value to enter in DELTA (a real delta nameplate quotes the line-to-line voltage, which IS its winding voltage - so a machine rated 400 V delta on a 400 V line enters 230 here; each winding then sees the full 400 V because it sits across a line pair). The READINGS analyze the machine at this nameplate; the time-domain march follows whatever actually drives the terminals.
  line_frequency:
    type: quantity
    units: hertz
    required: true
    description: The nameplate supply frequency. With the pole count it sets the synchronous speed n_s = 120*f/poles (1500 RPM for a 4-pole 50 Hz machine).
  pole_count:
    type: quantity
    units: dimensionless
    required: true
    description: The number of stator poles (even). Fewer poles spin faster; a 4-pole motor is synchronous at 1500 RPM on 50 Hz.
  stator_resistance:
    type: quantity
    units: ohm
    required: true
    description: R1, the per-WINDING stator resistance (the coil as wound, either connection). Sets part of the copper loss. In wye, at DC a phase-to-neutral loop is exactly this and a line-to-line loop two in series; in delta a line-to-line loop sees one winding in parallel with the other two in series (2/3 of a winding).
  stator_reactance:
    type: quantity
    units: ohm
    required: true
    description: X1, the per-phase stator leakage reactance at the nameplate frequency.
  rotor_resistance:
    type: quantity
    units: ohm
    required: true
    description: R2, the rotor resistance referred to the stator. It sets the slip and the starting torque - a higher R2 gives more starting torque but more running slip.
  rotor_reactance:
    type: quantity
    units: ohm
    required: true
    description: X2, the rotor leakage reactance referred to the stator. With a second cage present this pair becomes the OUTER (starting) cage — high resistance, low leakage.
  rotor_resistance_2:
    type: quantity
    units: ohm
    required: false
    description: "The INNER (running) rotor cage's resistance referred to the stator (per winding, like every impedance here — a delta stator refers it / 3). With rotor_reactance_2 it activates the DEEP-BAR DOUBLE-CAGE model — two real rotor circuits per axis, the strong-starting NEMA design B/C rotor. Fitted sets for real catalog machines: Monjo, Kojooyan-Jafari, Corcoles and Pedra, IEEE Trans. Energy Conversion 30(2), 2015, Table II (their circuit is exactly this topology): ABB 45 kW 400 V 50 Hz 4-pole — outer cage 0.524/0.130 ohm, inner cage 0.0604/0.428 ohm (per-phase wye, referred). Without both parameters the rotor stays a single cage, identically to before."
  rotor_reactance_2:
    type: quantity
    units: ohm
    required: false
    description: "The INNER (running) cage's leakage reactance at the nameplate frequency, referred to the stator — HIGH (the deep bar sits far from the air gap), which chokes this cage at standstill and routes the starting current through the high-resistance outer cage. Positive; used only together with rotor_resistance_2."
  core_loss_resistance:
    type: quantity
    units: ohm
    required: false
    description: "R_c, the core-loss (iron-loss) resistance per phase (referred; a delta stator refers it / 3), in PARALLEL with the magnetizing branch — hysteresis + eddy loss driven by the changing air-gap flux. Optional; carried in both the readings and the time-domain model, drawing nothing at DC. Derive from a cited core loss P_core and the air-gap EMF E_m: R_c = 3*E_m^2/P_core (Fitzgerald 6e Problem 6.10: a 460 V 25 kW 60 Hz machine, 220 W core loss, R_c ~ 927 ohm)."
  magnetizing_reactance:
    type: quantity
    units: ohm
    required: true
    description: Xm, the magnetizing reactance - the shunt branch that sets up the air-gap field and draws the no-load magnetizing current.
  load_torque:
    type: quantity
    units: newton*meter
    required: false
    description: The shaft load torque opposing rotation. The motor settles at the slip where its developed torque equals this; beyond the breakdown torque it stalls, and a load above the STARTING torque keeps it from ever leaving standstill.
  rotor_inertia:
    type: quantity
    units: kilogram*meter^2
    required: false
    description: J, the rotor's moment of inertia. Sets the mechanical spin-up time - how long the locked-rotor inrush lasts as the machine accelerates from rest. Without it the rotor is held at the nameplate operating speed (quasi-static) and the solver says so. A ~4 kW 4-pole 112-frame machine is ~0.015 kg*m^2 (motor only, no coupled load).
  magnetizing_knee_flux:
    type: quantity
    units: volt*second
    required: false
    description: The magnetization-curve KNEE - the PEAK resultant magnetizing flux linkage (V*s, PER WINDING; a delta stator refers it internally by 1/sqrt(3) with the winding) where the core leaves the linear region. With saturated_magnetizing_reactance it activates magnetic saturation of the magnetizing branch in the time-domain model; without both the branch stays linear. Measured by the IEEE Std 112 no-load test. Real machines are typically already saturated AT the rated point (Hinkkanen et al., IEEE Trans. Ind. Applications 46(3), 2010) - knees commonly ~0.8-1.1x the rated peak flux V_rated*sqrt(2)/omega. PEAK convention, not RMS.
  saturated_magnetizing_reactance:
    type: quantity
    units: ohm
    required: false
    description: The INCREMENTAL magnetizing slope above the knee, as a per-winding reactance at the nameplate frequency (a delta stator refers it /3 with every winding impedance). Measured values run ~0.3-0.7x the unsaturated Xm at rated flux (Hinkkanen et al. 2010, Tables I-II). Must sit below the unsaturated Xm; used only together with magnetizing_knee_flux.
  viscous_friction:
    type: quantity
    units: newton*meter*second/radian
    required: false
    description: B, the windage + bearing loss. A small drag the developed torque must also overcome.
behaviors:
  - electromechanical_coupling
  - produces_magnetic_field
  - conducts_current
  - produces_joule_heat
terminals:
  phase_a:
    description: Phase A - the reference winding's line terminal.
  phase_b:
    description: Phase B - the winding a third of a turn around the stator. Swap any two phase leads and the field sequence - and the rotation - reverses.
  phase_c:
    description: Phase C - the third winding. Leave any phase unwired and the machine is single-phasing - it cannot start from rest.
  neutral:
    description: The wye star point, brought out. Wire it for a 4-wire hookup (it carries only the imbalance of the three phase currents); leave it unwired for the common 3-wire machine (floating star).
support:
  model_status: defined
  solver_status: builtin_simple
extensions:
  overridable: true
  user_extensible: true
  allowed_origins: [builtin, community, user_local, project]
notes: |
  READINGS: the same per-phase steady-state analysis (Steinmetz) as the two-terminal sibling, at
  the nameplate supply - operating slip, speed, torque, running + locked-rotor current,
  mechanical power, efficiency, power factor (induction-motor-model.ts). TIME DOMAIN: the dq
  (stationary-reference-frame) dynamic model (induction-motor-dq.ts), fed by the REAL terminal
  waveforms - no synthesized phases, no drive-period detection, no nameplate assumption in the
  march. The winding-voltage Clarke components are common-mode invariant, so alpha/beta read
  straight off the phase terminals (the star voltage cancels) and no internal star node is
  needed; v_0 = (v_a+v_b+v_c)/3 - v_neutral lives only when the neutral is wired. An unwired
  port (floating star, open phase) is eliminated exactly by its zero-current condition. What
  falls out, verified against the phasor solution before implementation: a balanced positive-
  sequence set motors forward onto the Steinmetz operating point (0.01% agreement) with zero
  neutral current; swapping two leads reverses the rotation (negative sequence, equal and
  opposite starting torque); single-phasing from rest makes IDENTICALLY zero torque (the
  alpha/beta subsystems decouple at standstill) so a loaded machine never starts - named by the
  did-NOT-start warning; DC phase-to-neutral sees exactly R1 and line-to-line exactly 2*R1,
  matching the DC solver's wye / Y-to-delta stamp (the at-rest limit; DC-injection braking of a
  spinning rotor is unmodeled at DC). At DC the Math panel notes the machine's nets as balanced
  inside the solve rather than itemizing per-terminal currents (the multi-winding convention its
  three-phase alternator sibling also uses); the transient records every wired terminal's
  current. DELTA (stator_connection): the winding impedances are referred to the exact
  equivalent wye (Z/3 - the textbook transform, exact for identical windings at any excitation)
  and the machine marches with a floating star; the Y-to-delta of that equivalent gives back the
  REAL delta winding resistances, so the DC picture stays physical. A wired neutral in delta is
  ignored with a warning (a delta has no star point). The delta's internal zero-sequence
  circulating loop carries no current here because the marched field model is
  fundamental-sinusoidal — even with magnetic saturation on, which saturates the RESULTANT flux
  vector rather than each phase, so no third-harmonic EMFs (their circulating current would need
  a per-phase saturation model, an unmodeled rung). Fluxes integrate by the trapezoidal rule; the zero axis
  and mechanics stay implicit; the rotor speed is frozen within each circuit step. The load
  opposes motion and the shaft holds at rest until the developed torque exceeds it. MAGNETIC
  SATURATION of the magnetizing branch runs when the part carries its magnetization curve
  (magnetizing_knee_flux + saturated_magnetizing_reactance): the chord L_m follows a two-slope
  curve on the RESULTANT flux vector, one step lagged like the frozen rotor speed - exact for
  balanced sines, the standard main-flux space-vector approximation for unbalanced drives. It
  does NOT generate per-phase third harmonics (the model saturates the resultant, not each
  phase), so a delta's circulating current still reads zero; leakage (rotor-slot-bridge)
  saturation and cross-saturation stay unmodeled too. DEEP-BAR/SKIN EFFECT runs when the part
  carries its second rotor cage (rotor_resistance_2 + rotor_reactance_2): the machine marches
  SIX flux states (two rotor circuits per axis) whose settled steady state is exactly the
  parallel-two-cage phasor circuit the readings use; the double-cage torque curve's real
  pull-up DIP means a start can hang below its running point — CRAWLING, named by the solver.
  CORE LOSS runs when the part carries core_loss_resistance: the iron branch promotes the
  magnetizing flux to a real marched state (six states, or eight with the double cage), the
  settled steady state is the phasor circuit with R_c parallel the magnetizing branch, the
  developed torque still excludes the iron loss, and the core draws nothing at DC. Self-heating
  is an unmodeled rung.
  Sources: Tesla's 1888 polyphase patents; the Steinmetz equivalent circuit; Krause, "Analysis
  of Electric Machinery" (stationary-frame qd0); Fitzgerald, "Electric Machinery" (6e Problem
  6.10 for the core-loss placement); Chapman, "Electric Machinery Fundamentals"; the double-cage
  circuit and fitted catalog-machine parameters: Monjo, Kojooyan-Jafari, Corcoles and Pedra,
  IEEE Trans. Energy Conversion 30(2) 550-557, 2015 (Fig. 2b — this exact topology; full text
  verified 2026-07-11).
