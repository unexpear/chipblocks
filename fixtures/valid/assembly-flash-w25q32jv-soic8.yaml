notes: |
  WHAT IS HONESTLY ABSENT — looked for in the primary sources and not published:
    - Thermal resistance. No theta-JA, theta-JC or psi-JT appears anywhere in W25Q32JV rev J. A
      junction temperature for this part cannot be derived from its datasheet.
    - Decoupling. The datasheet specifies no bypass capacitor value, no recommended network and no
      power-supply filtering section, and AN0000009 adds none. The customary 0.1 uF close to pin 8 is
      good practice but is NOT a manufacturer statement, so it is not recorded here as one.
    - Output levels at usable currents. VOL/VOH are specified only at +/-100 uA. Output drive IS
      programmable (Status Register-3, DRV1/DRV0, four settings, 25 percent default) but Winbond
      publishes no current or impedance figure for ANY of the four settings — so this part's real
      drive strength is not available from the manufacturer at all.
    - ESD beyond +/-2000 V HBM (JESD22-A114A). No CDM, machine model or latch-up rating.

  The stored bitstream is data, not a device property, so solver_status is defined_not_solved: a board
  carrying this part lays out and checks correctly, and ChipBlocks does not pretend to simulate what
  reading it back would produce.
