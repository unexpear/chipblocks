# Valid fixture: the Winbond W25Q32JV 32 Mbit SPI NOR flash in the 8-pin 208-mil SOIC — the
# configuration memory a real iCE40 board loads its bitstream from at power-up.
#
# Like the FPGA next to it, what this part DOES with its contents is not a device property, so its
# stored-data behaviour is `defined_not_solved`. What is real and cited here is the part at its pins:
# one supply, eight pads, and the SPI signals the FPGA drives.
#
# SOURCES:
#   [DS]  Winbond, "W25Q32JV 3V 32M-BIT SERIAL FLASH MEMORY WITH DUAL, QUAD SPI", Revision J,
#         24 December 2024. Winbond prints no document number; the part name plus revision identifies
#         it. Revision J is current and differs from the widely-linked Revision G (27 March 2018) —
#         notably in the operating-voltage rows below.
#   [AN]  Winbond Application Note AN0000009, "Serial Flash PCB Layout Guidelines", Revision 2.0,
#         25 September 2017 — the LAND PATTERN, which the datasheet does not contain.
# MUST validate against definition.schema.json.
kind: assembly
id: flash_w25q32jv_soic8
origin: builtin
layer: assembly
name: Winbond W25Q32JV SPI NOR Flash (SOIC-8)
description: A 32 Mbit serial NOR flash in an 8-pin SOIC, read over SPI. On an FPGA board this is the configuration memory — the FPGA reads its bitstream out of here at power-up, which is why the FPGA's SPI bank supply and this part's supply are normally the same rail. Supports Standard, Dual and Quad SPI; in Quad mode two of the pins change role from write-protect and hold to data lines.
