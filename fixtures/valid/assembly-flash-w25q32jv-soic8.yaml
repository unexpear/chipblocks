terminals:
  cs_n:
    description: Chip select, active low — pad 1. Must go high-to-low after power-up before the part will accept an instruction. Wants a pull-up so it is not left floating while the FPGA's own pins are still high-impedance during configuration.
  do_io1:
    description: Data output, pad 2. Becomes bidirectional IO1 in Dual and Quad SPI modes.
  wp_n_io2:
    description: Write protect, active low — pad 3. Becomes bidirectional IO2 only when the Quad Enable bit is set.
  gnd:
    description: Ground, pad 4.
  di_io0:
    description: Data input, pad 5. Becomes bidirectional IO0 in Dual and Quad SPI modes.
  clk:
    description: Serial clock input, pad 6.
  hold_n_reset_n_io3:
    description: Hold or reset, active low — pad 7. Becomes bidirectional IO3 in Quad mode. Which of hold or reset this pin performs is itself configurable, so its function is not fixed by the package.
  vcc:
    description: Supply, pad 8. On an FPGA board this is normally the same rail as the FPGA's SPI bank supply, so that neither part drives the other while unpowered.
