# Valid fixture: a specific 365 nm near-UV AlGaN LED instance (~1 W class).
# Standard UV-A LED for applications like counterfeit-currency detection,
# forensic illumination, UV-cured adhesives, biological fluorescence imaging,
# black-light entertainment lighting.
#
# Typical specs for the 1 W UV-A LED class:
#   forward_voltage ~3.6 V (corresponds to AlGaN bandgap at low Al fraction)
#   max_forward_current ~350 mA continuous (~1.26 W input; ~750 mW heat
#                                            + ~500 mW UV output at 40% EQE)
#   peak_wavelength 365 nm (UV-A near-UV; well within visible-violet range
#                            for human perception at high power — but the
#                            emission is mostly above eye-detectable range)
#   l70_lifetime_hours ~5000 (mid-range for UV-A — better than deep-UV,
#                              substantially less than visible LEDs)
#   uv_safety_class RG2 (moderate risk — eye protection recommended for
#                         continuous direct viewing; aversion response
#                         relied upon for incidental exposure per
#                         IEC 62471 risk-group definition)
#
# Real-world parts in this class: Bolb BS-1-365-T, Stanley QBHP684-UV,
# Nichia NCSU033C, LG Innotek LEUVA66B70HL00. Specifications vary by
# manufacturer; this fixture uses nominal mid-range values.
# MUST validate against instance.schema.json.
