notes: |
  Inherits AlGaN n+p material defaults from led_uv_algan definition (Sprint
  10 materials at the low-Al / UV-A end of the AlGaN composition range).
  At 365 nm the human eye can sometimes faintly perceive the emission as
  violet at high power because the human cone response extends slightly
  below 400 nm. Genuinely invisible UV operation requires shorter
  wavelengths (UV-B 280-315 nm or UV-C below 280 nm). For black-light
  applications (fluorescence excitation), 365 nm is preferred over shorter
  wavelengths because the longer wavelength penetrates further into
  fluorescent substrates with less surface absorption.
  Eye-safety RG2 designation: the 1 W power at 120-degree viewing angle
  spreads the irradiance enough that brief incidental exposure relies on
  natural blink reflex; sustained direct viewing (or focused beam) requires
  UV-blocking eyewear (e.g., ANSI Z87.1 spectacles with UV rating).
  Lifetime 5000 hours is mid-range for UV-A; high-end industrial UV-A LEDs
  reach 10,000 hours, while cheaper consumer-grade UV-A drops to 1000-2000
  hours. Operating at lower current and good heat-sinking extends lifetime.
