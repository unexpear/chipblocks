# Valid fixture: triode (Lee de Forest's Audion, 1906) — the first AMPLIFIER, and the
# device that truly began electronics. It is a vacuum diode with a third electrode
# added between the cathode and the plate: a control GRID. The grid sits in the path of
# the electron stream but draws almost no current itself (it is held negative), yet a
# small change in its voltage strongly steers the plate current. Because the grid is
# closer to the cathode than the plate is, it is MU times more effective at controlling
# the current (mu, the amplification factor) — so a tiny grid signal produces a large
# plate-current (and, across a load resistor, a large plate-voltage) swing. That is
# amplification, and it gave us radio, long-distance telephony, and eventually the
# computer.
#
# The plate current follows the grid-tube form of the Child-Langmuir law:
#   I_p = perveance * (V_grid + V_plate/mu)^1.5      (the effective voltage > 0)
# A transconductance device, exactly like a MOSFET (grid ~ gate, plate ~ drain, cathode
# ~ source): the solver stamps g_m = dI_p/dV_grid and g_p = dI_p/dV_plate = g_m/mu, so
# the plate resistance r_p = mu/g_m and mu = g_m*r_p falls out by construction (the
# textbook tube relation). Perveance is derived from a rated operating point (a plate
# current at a plate/grid bias) plus mu.
#
# Honest scope: the cathode is assumed HOT (space-charge-limited regime); the idealized
# 3/2-power law is the honest first rung — real tubes deviate (the Koren empirical model
# with a fitted exponent is the refinement), so g_m is in the right ballpark but not
# datasheet-exact. The heater warm-up, grid current at positive grid, and grid-cathode
# capacitance are documented gaps. Electrode materials are catalog stand-ins.
#
# MUST validate against definition.schema.json.
kind: primitive_device
id: triode
origin: builtin
layer: primitive_device
name: "Triode (de Forest Audion)"
description: "A three-electrode vacuum tube and the first amplifier (de Forest, 1906): a control grid between the cathode and plate steers the plate current while drawing ~no current itself. The grid is mu times more effective than the plate, so a small grid voltage swing makes a large plate swing — gain. The plate current follows the grid-tube Child-Langmuir law I_p = perveance*(V_grid + V_plate/mu)^1.5, solved as a transconductance device (the same companion shape as a MOSFET, with g_m = dI_p/dV_grid and the relation mu = g_m*r_p). Parameterized by mu plus a rated operating point."
composition:
  requires:
    cathode:
      kind: material
      must_enable:
        - electrical_conduction
    grid:
      kind: material
      must_enable:
        - electrical_conduction
    plate:
      kind: material
      must_enable:
        - electrical_conduction
    endpoints:
      kind: interface
      min_count: 3
parameters:
  cathode_material:
    type: material_ref
    satisfies_role: cathode
    required: true
    description: The hot cathode that emits the electrons. Real tubes use an oxide-coated nickel cathode or (thoriated) tungsten; the catalog's tungsten stands in. The current comes from the rated point plus the Child-Langmuir law, not this material's bulk properties.
  grid_material:
    type: material_ref
    satisfies_role: grid
    required: true
    description: The control grid — a fine wire helix between cathode and plate (nickel or molybdenum wire in real tubes). The catalog's copper stands in. It draws ~no current in normal (negative-grid) operation.
  plate_material:
    type: material_ref
    satisfies_role: plate
    required: true
    description: The plate (anode) that collects the electrons — a conductor (nickel, molybdenum, or graphite). The catalog's copper stands in.
  amplification_factor:
    type: quantity
    units: dimensionless
    required: true
    description: "mu — how many times more effective the grid is than the plate at controlling the plate current, and the maximum (open-circuit) voltage gain. A high-mu preamp triode (12AX7) is ~100; medium-mu tubes are ~20-40. mu = g_m * r_p."
  reference_plate_voltage:
    type: quantity
    units: volt
    required: true
    description: The plate-cathode voltage of the rated operating point. With the grid voltage and plate current it fixes the perveance via the effective voltage V_grid + V_plate/mu.
  reference_grid_voltage:
    type: quantity
    units: volt
    required: true
    description: The grid-cathode voltage at the rated operating point (negative for class-A bias). The effective voltage V_grid + V_plate/mu at this point must be positive (the tube conducting) for the perveance to calibrate.
  plate_current_at_reference:
    type: quantity
    units: ampere
    required: true
    description: The plate current at the rated operating point. Sets the perveance (the tube's space-charge constant) and, with mu, the transconductance.
  max_plate_dissipation:
    type: quantity
    units: watt
    required: false
    description: Maximum plate dissipation. Above it the plate glows cherry-red and the tube fails — the over-dissipation check fires when the solved plate power exceeds this.
  max_plate_voltage:
    type: quantity
    units: volt
    required: false
    description: Maximum plate voltage (a reference rating).
behaviors:
  - thermionic_emission
  - acts_as_transistor
  - conducts_current
  - produces_joule_heat
terminals:
  plate:
    description: The plate (anode) — collects the electrons. The amplified output.
  grid:
    description: The control grid — the input. Steers the plate current; draws ~no current when held negative.
  cathode:
    description: The hot cathode — the electron emitter and the common reference.
support:
  model_status: defined
  solver_status: builtin_simple
extensions:
  overridable: true
  user_extensible: true
  allowed_origins: [builtin, community, user_local, project]
notes: |
  Solved by the grid-tube Child-Langmuir law I_p = perveance*(V_grid + V_plate/mu)^1.5
  through the DC and transient Newton-Raphson companion loops (vacuum-tube-model.ts
  gridTubeOperatingPoint, the same transconductance companion shape as a MOSFET, with
  grid/plate/cathode in place of gate/drain/source). The plate-dissipation failure
  check fires when |I_plate|*|V_plate-cathode| exceeds max_plate_dissipation. Honest
  scope: the cathode is assumed hot (space-charge-limited regime); the idealized 3/2
  law is the first rung (real tubes follow the Koren empirical model with a fitted
  exponent, so g_m is the right order of magnitude but not datasheet-exact); the heater
  warm-up, positive-grid grid current, and inter-electrode capacitances are documented
  gaps. The electrode materials are catalog stand-ins. The grid current is taken as
  zero (negative-grid class-A operation), exactly like a MOSFET's insulated gate.
  Sources: de Forest's Audion (1906); the triode 3/2-power equation and mu = g_m*r_p
  (Spangenberg, "Vacuum Tubes", 1948).
