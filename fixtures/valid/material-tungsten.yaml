# Valid fixture: material definition for tungsten (W, wolfram).
# The refractory metal of choice for lamp filaments, vacuum-tube cathodes/grids,
# X-ray targets, and welding electrodes. Its defining property is the HIGHEST
# melting point of any metal (3422 C) — which is what lets a drawn-and-coiled
# tungsten filament glow at ~2700 K for hundreds of hours without melting. It is a
# good (not great) conductor, ~3x the resistivity of copper, with a strong positive
# temperature coefficient of resistance: a tungsten filament's resistance climbs
# ~14x from cold to its operating temperature, the origin of incandescent-lamp
# inrush current.
#
# In AIR tungsten oxidizes rapidly to volatile WO3 above ~400-500 C, so its high-
# temperature service is only in a VACUUM or inert-gas envelope (exactly the inside
# of an incandescent bulb) — see notes. The lamp-filament emissivity is ~0.35 in the
# visible/near-IR at incandescent temperatures (documented in notes; folded into the
# bulb's radiation balance, not carried as a structured property here).
#
# MUST validate against definition.schema.json.
