notes: |
  Tungsten's filament utility is the combination of the highest melting point of any
  metal (3422 C), adequate ductility once doped (the "non-sag" AKS / potassium-bubble
  tungsten that resists recrystallization creep), and a strong positive temperature
  coefficient of resistance. The high TCR is why a cold filament is ~14x lower in
  resistance than at its ~2700 K operating point — the source of incandescent-lamp
  switch-on inrush, modeled on the incandescent_bulb device via the tungsten power
  law R(T) = R_op*(T/T_op)^1.2 (electro-thermal.ts).
  Air-oxidation caveat: in air tungsten starts to oxidize to WO3 above ~400 C,
  oxidizes rapidly above ~600 C, and the oxide turns volatile above ~800 C — so its
  high-temperature service (a glowing filament) is only inside a vacuum or inert-gas
  (argon/nitrogen) envelope. A halogen lamp adds a trace halogen for the regenerative
  tungsten-halogen cycle that redeposits evaporated tungsten.
  Filament emissivity is ~0.35 in the visible/near-IR at incandescent temperatures
  (it rises toward shorter wavelengths); this is folded into the bulb's Stefan-
  Boltzmann radiation balance via the rated operating point, not carried as a
  structured property here. Sources: CRC Handbook 102nd ed.; ASM Metals Handbook.
