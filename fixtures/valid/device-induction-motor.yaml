# Valid fixture: three-phase induction (asynchronous) motor — Nikola Tesla's rotating-field
# machine (his 1888 polyphase patents), the workhorse that turned AC power into the world's
# mechanical work. Most of the electricity used to do work passes through one of these.
#
# It has NO electrical connection to its rotor. A polyphase stator winding makes a magnetic field
# that ROTATES at the synchronous speed n_s = 120*f/poles; the rotor (a shorted "squirrel cage") is
# dragged along but always LAGS by the slip s = (n_s - n)/n_s. That lag is the whole point: it is
# the relative motion that induces the rotor currents (Faraday) which, in the rotating field, make
# the torque (Lorentz). At exactly synchronous speed there is no lag, no induced current and no
# torque, so it must run a little slow, and slips more the harder it is loaded.
#
# Modeled by its per-phase equivalent circuit (Steinmetz), referred to the stator: the supply drives
# R1 + jX1, then the parallel of the magnetizing jXm and the rotor branch R2/s + jX2. The R2/s term
# carries the speed dependence — at standstill (s=1) the rotor branch is low-impedance, so the motor
# gulps a big LOCKED-ROTOR (starting) current (typically 5-7x running) that tapers as it comes up to
# speed. The torque T = 3*I2^2*(R2/s)/omega_s rises with slip to a breakdown (pull-out) torque, then
# falls. The solver finds the operating slip where the developed torque meets the load
# (induction-motor-model.ts) and reports the speed, torque, running + starting current, mechanical
# power, efficiency and power factor.
#
# Honest scope: the READINGS (speed, slip, torque, currents, efficiency, power factor) come from
# the steady-state per-phase analysis at the nameplate supply voltage + line frequency (the way
# induction motors ARE rated and read). In the TIME-DOMAIN solve the motor is the dq
# (stationary-reference-frame) DYNAMIC model (induction-motor-dq.ts): switch the supply on and,
# given a rotor_inertia, the rotor genuinely SPINS UP from rest — the scope shows the real
# locked-rotor inrush current at standstill (5-7x running on typical industrial machines; ~4.4x
# for the shipped defaults, whose per-unit stator resistance is on the high side) tapering to
# the running current as the slip settles where the developed torque meets the load. The marched machine reduces exactly to the Steinmetz
# circuit at steady state, and because its reactances convert to inductances once (at the
# nameplate frequency) it is honest at ANY drive frequency or waveform — a 60 Hz or inverter
# drive is marched for real (the solver still warns that the readings panel assumes the
# nameplate). Without a rotor_inertia the rotor is held at the nameplate operating speed (the
# older quasi-static behavior, kept so saved circuits keep solving) and the solver says so. The
# two-terminal port carries ONE phase of the balanced machine; the two unseen phases are the port
# waveform delayed by thirds of the drive period (before a delay elapses they read 0 V — phases
# energizing staggered, like breaker poles closing in sequence), and the zero-sequence path
# (a 4-wire-wye convention) is what keeps DC honest: on a battery the machine makes no torque and
# degenerates to exactly the stator R1 the DC solve uses (the engines agree on DC content).
# MAGNETIC SATURATION of the magnetizing branch is modeled when the part carries its
# magnetization curve (magnetizing_knee_flux + saturated_magnetizing_reactance, from a no-load
# test): the chord L_m follows a two-slope curve on the resultant flux vector — drive it
# overvoltage and the no-load current rises super-linearly, the real overfluxing signature.
# Leakage (rotor-slot-bridge) saturation stays unmodeled — that is where real machines get their
# extra STARTING current — and a shorted cage suppresses transformer-style flux doubling at
# switch-on. Self-heating, thermal protection, deep-bar/skin effect and core loss are unmodeled.
# A TRUE 3-phase hookup (three phase ports + the star point) ships as its
# sibling part, induction_motor_three_phase - use that one for real reversal (swapped leads) and
# single-phasing; the single-phase double-revolving-field machine remains a refinement.
#
# MUST validate against definition.schema.json.
kind: primitive_device
id: induction_motor
origin: builtin
layer: primitive_device
name: "AC induction motor (3-phase)"
description: "A three-phase induction motor (Tesla, 1888). A polyphase stator winding makes a magnetic field that rotates at the synchronous speed, dragging a shorted squirrel-cage rotor that always lags by the slip — the lag is what induces the rotor currents that make the torque. Readings come from its per-phase equivalent circuit (Steinmetz) at the nameplate supply — the operating slip where the developed torque meets the load, with speed, torque, running and locked-rotor (starting) current, mechanical power, efficiency and power factor. In the time domain it is the dq dynamic model — given a rotor inertia the rotor genuinely spins up from rest, drawing the real locked-rotor inrush that tapers as the slip settles."
composition:
  requires:
    winding:
      kind: material
      must_enable:
        - electrical_conduction
    endpoints:
      kind: interface
      min_count: 2
parameters:
  winding:
    type: material_ref
    satisfies_role: winding
    required: true
    default:
      value: copper
    description: The conductor the stator is wound from. Must conduct; copper is the standard.
  supply_voltage:
    type: quantity
    units: volt
    required: true
    description: The per-phase RMS supply voltage. The motor is analyzed at this nameplate voltage. For a 400 V three-phase line the per-phase value is 230 V.
  line_frequency:
    type: quantity
    units: hertz
    required: true
    description: The supply frequency. With the pole count it sets the synchronous speed n_s = 120*f/poles (1500 RPM for a 4-pole 50 Hz machine).
  pole_count:
    type: quantity
    units: dimensionless
    required: true
    description: The number of stator poles (even). Fewer poles spin faster; a 4-pole motor is synchronous at 1500 RPM on 50 Hz.
  stator_resistance:
    type: quantity
    units: ohm
    required: true
    description: R1, the per-phase stator winding resistance. Sets part of the copper loss, and the DC-solve resistance (on DC the motor is just this winding).
  stator_reactance:
    type: quantity
    units: ohm
    required: true
    description: X1, the per-phase stator leakage reactance at the line frequency.
  rotor_resistance:
    type: quantity
    units: ohm
    required: true
    description: R2, the rotor resistance referred to the stator. It sets the slip and the starting torque — a higher R2 gives more starting torque but more running slip.
  rotor_reactance:
    type: quantity
    units: ohm
    required: true
    description: X2, the rotor leakage reactance referred to the stator.
  magnetizing_reactance:
    type: quantity
    units: ohm
    required: true
    description: Xm, the magnetizing reactance — the shunt branch that sets up the air-gap field and draws the no-load magnetizing current.
  load_torque:
    type: quantity
    units: newton*meter
    required: false
    description: The shaft load torque opposing rotation. The motor settles at the slip where its developed torque equals this; beyond the breakdown torque it stalls.
  rotor_inertia:
    type: quantity
    units: kilogram*meter^2
    required: false
    description: J, the rotor's moment of inertia. Sets the mechanical spin-up time — how long the locked-rotor inrush lasts as the machine accelerates from rest (the time-domain dq model integrates J*domega/dt = T_e - B*omega - T_load). Without it the rotor is held at the nameplate operating speed (quasi-static) and the solver says so. A ~4 kW 4-pole 112-frame machine is ~0.015 kg*m^2 (motor only, no coupled load).
  magnetizing_knee_flux:
    type: quantity
    units: volt*second
    required: false
    description: The magnetization-curve KNEE — the PEAK resultant magnetizing flux linkage (V*s) where the core leaves the linear region. With saturated_magnetizing_reactance it activates magnetic saturation of the magnetizing branch in the time-domain model; without both the branch stays linear. Measured by the IEEE Std 112 no-load test (voltage swept 125% down to 25% of rated). Real industrial machines are typically already saturated AT the rated point (Hinkkanen et al., IEEE Trans. Ind. Applications 46(3), 2010) — knees commonly sit at ~0.8-1.1x the rated peak flux, V_rated*sqrt(2)/omega. PEAK convention, not RMS.
  saturated_magnetizing_reactance:
    type: quantity
    units: ohm
    required: false
    description: The INCREMENTAL magnetizing slope above the knee, as a reactance at the nameplate frequency. Measured values run ~0.3-0.7x the unsaturated Xm at rated flux and fall further above it (Hinkkanen et al. 2010, Tables I-II — a 2.2 kW machine measured chord 1.584 pu vs incremental 0.506 pu at the rated point). Must sit below the unsaturated Xm; used only together with magnetizing_knee_flux.
  viscous_friction:
    type: quantity
    units: newton*meter*second/radian
    required: false
    description: B, the windage + bearing loss. A small drag the developed torque must also overcome, lowering the efficiency a little.
behaviors:
  - electromechanical_coupling
  - produces_magnetic_field
  - conducts_current
  - produces_joule_heat
terminals:
  terminal_a:
    description: One line terminal. Non-polar (AC). The single canvas AC source across the two terminals stands in for the per-phase line voltage of a balanced three-phase set.
  terminal_b:
    description: The other line terminal.
support:
  model_status: defined
  solver_status: builtin_simple
extensions:
  overridable: true
  user_extensible: true
  allowed_origins: [builtin, community, user_local, project]
notes: |
  READINGS: the per-phase equivalent circuit (Steinmetz), referred to the stator (V1 across
  R1 + jX1, then jXm in parallel with R2/s + jX2 — induction-motor-model.ts). The solver computes
  the Thevenin equivalent seen by the rotor branch, then finds the operating slip where the
  developed torque T = 3*V_th^2*(R2/s) / (omega_s*((R_th + R2/s)^2 + (X_th + X2)^2)) equals the load
  + friction, on the stable branch below the breakdown slip; from it the speed, running stator
  current, power factor, locked-rotor (starting) current at s=1, mechanical power, efficiency and
  slip are read. Synchronous speed omega_s = 4*pi*f/poles. TIME DOMAIN: the dq
  (stationary-reference-frame) dynamic model (induction-motor-dq.ts) — stator + rotor flux
  linkages in the alpha-beta frame, the zero-sequence current, and the rotor speed as states:
  d(lambda_s)/dt = v - R_s*i_s; d(lambda_r)/dt = -R_r*i_r -/+ omega_re*lambda_r(cross);
  T_e = (3/2)(P/2)(lambda_alpha*i_beta - lambda_beta*i_alpha); J*domega/dt = T_e - B*omega -
  T_load (the load opposes motion; the shaft holds at rest until |T_e| exceeds it). At steady
  state this reduces EXACTLY to the Steinmetz circuit (R2/s emerges from the rotor speed-voltage
  term), so the marched waveform agrees with the readings at the nameplate; reactances convert to
  inductances once (L = X / 2*pi*f_nameplate), making the march honest at any drive frequency or
  waveform. The two unseen phases of the balanced machine are the port waveform delayed by thirds
  of the drive period (0 V before a delay elapses — staggered energization; an un-energized phase
  is held at 0 V, a stated fiction of the single-port representation). The zero-sequence path is
  a 4-wire-wye convention: it is what makes a battery see exactly the stator R1 the DC solver
  stamps, with zero torque, so the engines agree on DC. The port carries ONE phase's electrical
  power; torque and mechanical power are whole-machine (three-phase) quantities, the same
  convention the readings use. Fluxes integrate by the trapezoidal rule (backward-Euler's
  first-order damping visibly inflates the settled slip at the machine's lightly-damped low-slip
  operating point); the zero axis and the mechanical step stay implicit for robustness; the rotor
  speed is frozen within each circuit step (the mechanical time constant dwarfs the step). The
  solver refuses a time step at or past a third of the drive period (the unseen-phase synthesis
  would silently corrupt) and says so. Without rotor_inertia the rotor is held at the nameplate
  operating speed (quasi-static, the pre-dynamic behavior) with a warning. Self-heating and
  thermal protection are unmodeled; NOTE for a future theta_JA: the terminal power is the INPUT
  power, most of which leaves as mechanical output at rated load — heat is P_in - P_mech, never
  the whole terminal ledger. Magnetic saturation, deep-bar/skin effect and core loss are
  unmodeled refinements. The true 3-phase (three-port) machine ships separately as
  induction_motor_three_phase; the single-phase double-revolving-field machine remains a
  refinement. Sources: Tesla's 1888 polyphase patents; the Steinmetz
  equivalent circuit; Krause, "Analysis of Electric Machinery" (the stationary-frame qd0 model);
  Fitzgerald, "Electric Machinery"; Chapman, "Electric Machinery Fundamentals".
