name: "Silicon, n-type (Si doped with phosphorus or arsenic donors)"
description: "Group IV semiconductor element doped n-type via phosphorus (most common) or arsenic donor atoms. The dominant material for general-purpose silicon diodes, BJT n-regions, MOSFET n-channels, and the vast majority of integrated circuit silicon. Bandgap is 1.12 eV indirect at room temperature — same as intrinsic silicon — but doping drops resistivity by many orders of magnitude depending on concentration."
