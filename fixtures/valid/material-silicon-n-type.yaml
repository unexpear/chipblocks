# Valid fixture: material definition for n-doped silicon — the n-side material
# of silicon PN junctions and the semiconductor side of silicon Schottky diodes.
#
# Same base material as the Sprint 4 intrinsic silicon entry, but with n-type
# dopants (phosphorus or arsenic donors) deliberately introduced. Doping drops
# resistivity by ~6-9 orders of magnitude relative to intrinsic depending on
# concentration, and shifts the Fermi level toward the conduction band.
#
# Silicon's bandgap is INDIRECT (1.12 eV) — radiative recombination is
# inefficient (phonon-assisted), which is why silicon LEDs don't work well.
# This entry therefore does NOT enable direct_bandgap, distinguishing it from
# the AlGaInP variants used in red LEDs (Sprint 7).
#
# Used by: diode_silicon_rectifier (S8-v3-4), diode_schottky_al_si (S8-v3-5),
# diode_zener_silicon (S8-v3-6). Future devices using silicon n-type: BJTs
# (collector + base + emitter), MOSFETs (channel + drain + source), CMOS ICs.
#
# MUST validate against definition.schema.json.
