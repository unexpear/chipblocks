notes: |
  Doping: nominal donor concentration 1e16 to 1e19 per cubic centimeter via
  phosphorus or arsenic. Specific doping profiles depend on the device:
  rectifier base region uses lighter doping (better reverse blocking);
  Zener cathode + Schottky n-region use moderate-to-heavy doping.
  No direct_bandgap capability — silicon's indirect bandgap means radiative
  recombination is phonon-assisted and inefficient. This is the physical reason
  silicon is not used for visible LEDs; the AlGaInP system from Sprint 7 is
  preferred for that application.
  Future related materials: doped silicon variants of different concentration
  (silicon_n_type_heavy, silicon_n_type_light) may land when integrated-circuit
  manufacturing layers need finer distinction. Sprint 8 keeps a single n-type
  variant covering the typical-diode range.
