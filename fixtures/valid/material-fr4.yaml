notes: |
  FR4 values vary significantly by grade. This entry is the IPC-4101/126 baseline.
  High-Tg variants (170-180 C Tg), low-Dk RF variants (Rogers RO4350B at Dk 3.48),
  and specialty halogen-free variants each warrant their own material definitions.
  No board uses FR4 yet in Sprint 4 — when board-level definitions arrive, the stackup
  model will reference specific FR4 grades.
