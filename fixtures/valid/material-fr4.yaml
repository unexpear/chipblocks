# Valid fixture: material definition for FR4 (flame-retardant glass-epoxy laminate).
# The dominant PCB substrate. Composite of woven E-glass fabric impregnated with epoxy resin.
# FR4 values vary materially by manufacturer and grade. Confidence dropped one tier per
# MATERIAL-SOURCES.md (multi-source agreement principle) — values cited here are
# IPC-4101/126 standard grade at 1 MHz; specific datasheets must be consulted for
# specialty grades, high-frequency variants (low-Dk), and high-Tg variants.
# MUST validate against definition.schema.json.
kind: material
id: fr4
origin: builtin
layer: material
name: FR4 (woven-glass epoxy laminate)
description: Flame-retardant composite laminate — woven E-glass fiber fabric impregnated with brominated epoxy resin, cured under heat and pressure. The dominant PCB substrate material. Used as the structural and dielectric layer in nearly all consumer-grade printed circuit boards.
composition:
  uses: []
enables:
  - electrical_insulation
  - dielectric_insulation
