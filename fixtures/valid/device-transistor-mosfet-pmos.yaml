# Valid fixture: P-channel enhancement MOSFET — the polarity mirror of the
# NMOS, and the other half of every CMOS pair. The gate must be pulled BELOW
# the source (negative V_GS past the negative threshold) to invert the n-type
# body into a p-channel. In CMOS logic the PMOS sits on the supply side
# pulling the output HIGH while its NMOS partner pulls LOW — only one of the
# pair conducts at rest, which is why CMOS sips power.
#
# Same three-region Level-1 model as the NMOS (mosfet-model.ts), computed in
# the mirrored frame. Body tied to source (discrete-package convention,
# BS250 class).
#
# MUST validate against definition.schema.json.
kind: primitive_device
id: transistor_mosfet_pmos
origin: builtin
layer: primitive_device
name: "P-channel MOSFET (enhancement)"
description: "The polarity mirror of the N-channel MOSFET: gate, drain, source with the body tied to the source. Pulling the gate BELOW the source past the (negative) threshold forms a p-channel; current then flows source to drain. The insulated gate draws no DC current. Modeled by the same three-region Level-1 equations in the mirrored frame. The high-side half of every CMOS logic pair, and the standard high-side switch."
composition:
  uses:
    - pn_junction
  requires:
    body_region:
      kind: material
      must_enable:
        - n_type_semiconductor
    source_drain_regions:
      kind: material
      must_enable:
        - p_type_semiconductor
    gate_dielectric:
      kind: material
      must_enable:
        - electrical_insulation
    endpoints:
      kind: interface
      min_count: 3
parameters:
  body_region:
    type: material_ref
    satisfies_role: body_region
    required: true
    default:
      value: silicon_n_type
    description: The n-type body the channel inverts in. Tied to the source terminal in this three-terminal (discrete-package) device.
  source_drain_regions:
    type: material_ref
    satisfies_role: source_drain_regions
    required: true
    default:
      value: silicon_p_type
    description: The heavily p-doped source and drain wells the channel connects.
  gate_dielectric:
    type: material_ref
    satisfies_role: gate_dielectric
    required: true
    default:
      value: silicon_dioxide
    description: The insulating layer between gate and channel — the O in MOS. Its quality sets the absolute-maximum gate voltage.
  threshold_voltage:
    type: quantity
    units: volt
    required: true
    description: Gate-source threshold V_th — NEGATIVE for an enhancement PMOS (e.g. BS250 class ~ −2.5 V typical). The gate must sit below the source by more than its magnitude to conduct.
  transconductance_parameter:
    type: quantity
    units: ampere_per_volt_squared
    required: true
    description: "The device transconductance parameter k = k'·(W/L), used in the mirrored frame: |I_D(sat)| = (k/2)·(V_GS − V_th)² with both voltages negative. Derivable from a datasheet (I_D(on), V_GS) point."
  channel_length_modulation:
    type: quantity
    units: per_volt
    required: false
    description: λ — the slight rise of saturation current magnitude with |V_DS|. Textbook Level-1 class values 0.01-0.05 per volt.
  threshold_temperature_coefficient:
    type: quantity
    units: volt_per_kelvin
    required: false
    description: "dV_th/dT — the threshold MAGNITUDE falls as the junction heats, so for a P-channel (negative V_th) the signed coefficient is POSITIVE (V_th drifts toward zero). Datasheets plot this as a curve, not a spec line. Omitted = no drift modeled. The companion mobility fall, k ∝ (T/T₀)^−1.5, needs no parameter — it applies whenever the electro-thermal loop supplies a junction temperature."
  max_drain_current:
    type: quantity
    units: ampere
    required: false
    description: Maximum continuous drain current magnitude (BS250 class ~ 230 mA continuous).
  drain_source_breakdown_voltage:
    type: quantity
    units: volt
    required: false
    description: Maximum |V_DS| before avalanche breakdown (BS250 class ~ 45 V).
  max_gate_source_voltage:
    type: quantity
    units: volt
    required: false
    description: Absolute-maximum |V_GS| — beyond it the gate oxide ruptures permanently. BS250 class ±20 V.
  thermal_resistance_junction_ambient:
    type: quantity
    units: kelvin_per_watt
    required: false
    description: Junction-to-ambient thermal resistance (θ_JA) of the package.
  max_operating_temperature:
    type: quantity
    units: celsius
    required: false
    description: Maximum junction operating temperature for the stage-7 thermal check.
behaviors:
  - acts_as_transistor
  - conducts_current
  - produces_joule_heat
terminals:
  gate:
    description: The insulated control terminal — pulled BELOW the source past the threshold magnitude to form the channel. Draws no DC current.
  drain:
    description: The terminal current exits when the channel is on (conventional current flows source → drain in a PMOS).
  source:
    description: The reference terminal, conventionally tied toward the positive supply; the body is tied here (discrete-package convention).
support:
  model_status: defined
  solver_status: builtin_simple
extensions:
  overridable: true
  user_extensible: true
  allowed_origins: [builtin, community, user_local, project]
notes: |
  Identical Level-1 physics to the NMOS, evaluated in the mirrored frame
  (mosfet-model.ts flips signs once, in one place, with tests pinning the
  mirror). Same honest gaps as the NMOS: no body diode, gate capacitance, or
  avalanche yet. P-channel mobility is lower than n-channel in silicon, which
  is why a comparable PMOS (BS250 vs 2N7000) carries a smaller k — visible in
  the cited canvas defaults.
