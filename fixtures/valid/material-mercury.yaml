# Valid fixture: material definition for mercury (Hg, quicksilver).
# The ONLY metal that is liquid at room temperature (melting point -38.83 C) — a dense,
# silvery, mobile liquid conductor. That liquid-metal character is its whole electrical
# value: it makes a self-healing, bounce-free, gravity-positioned contact. Historic and
# legacy uses: the mercury TILT switch (a blob bridges two contacts when tipped), the
# mercury-WETTED relay (bounce-free, low-resistance switching), the mercury-VAPOR and
# fluorescent lamp (an arc through mercury vapor radiates UV that a phosphor converts to
# visible light), thermometers/barometers, and the old mercury-cell battery. Mercury was
# also the historic resistance standard — the 1908 "international ohm" was defined as the
# resistance of a specified mercury column at 0 C.
#
# A modest conductor: ~57x the resistivity of copper, so a poor wire but a perfectly good
# liquid contact. TOXICITY: mercury and its vapor are potent neurotoxins, and mercury is
# RoHS-restricted — most consumer mercury devices (tilt switches, thermometers, vapor
# lamps) have been phased out for safety/environmental reasons. Carried here as a real
# Layer-0 material; see notes before assuming any device use is current-practice.
#
# MUST validate against definition.schema.json.
