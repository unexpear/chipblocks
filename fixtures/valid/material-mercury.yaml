notes: |
  Mercury's electrical use rests entirely on being a LIQUID metal: it forms a contact
  that flows back together (self-healing), does not bounce (no contact chatter), and
  positions itself by gravity (the tilt switch). Legacy/again-noted devices: the mercury
  tilt switch (a blob bridges two sealed contacts when tipped past an angle); the
  mercury-wetted reed relay (contacts film-coated with mercury for bounce-free, very
  low-resistance, long-life switching); the mercury-vapor and fluorescent lamp (a
  low-pressure arc through mercury vapor emits 254 nm UV that a phosphor coating
  re-emits as visible light); thermometers and barometers (thermal expansion / weight of
  a dense liquid); and the mercury (zinc-mercuric-oxide) cell, a very flat-discharge
  battery once used in hearing aids and watches.
  TOXICITY / ENVIRONMENTAL: mercury is a cumulative neurotoxin and its vapor is
  especially hazardous; it is restricted under RoHS and the Minamata Convention, and most
  consumer mercury devices have been phased out and replaced (solid-state tilt sensors,
  LED/electronic lamps, digital thermometers, alkaline/silver cells). Treat any mercury
  device here as historical context, not a recommendation. Sources: CRC Handbook 102nd
  ed.; the international-ohm resistance standard (1908).
