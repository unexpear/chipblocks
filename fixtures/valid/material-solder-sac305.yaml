notes: |
  Composition by weight: 96.5% Sn, 3.0% Ag, 0.5% Cu. Structured composition-by-weight
  schema field is a §15 deferred question — current description/notes capture is the
  workaround.

  Regulatory status: RoHS-compliant (no lead, no other restricted substances). The default
  solder choice for new consumer-electronics designs after RoHS took effect.

  Mushy-zone behavior: unlike a eutectic alloy, SAC305 passes through a small two-phase
  region (217-220 C) during melting. This affects reflow profile design — peak temperatures
  of 245-250 C are typical (~25-30 C above liquidus, per IPC J-STD-020). Vibration during
  this range can produce 'cold' joints. Captured here for documentation; reflow profile
  itself is a manufacturing-pipeline concern (Sprint 6+).

  Tin whiskering — pure-tin and high-tin lead-free solders can grow fine conductive
  whiskers over time, a known reliability concern. SAC305's silver and copper additions
  mitigate but do not eliminate it. Reliability-domain concern, not modeled in Sprint 4.

  Joint-level concerns (paste behavior, reflow profile, wetting) attach to the
  solder_joint interface (S4-v3-5) and to the default_reflow_peak_temp Active Variable
  (Sprint 5), not to this material entry.
