description: Lead-free tin-silver-copper solder alloy, nominally 96.5% tin, 3.0% silver, 0.5% copper by weight. The dominant lead-free solder for RoHS-compliant consumer electronics. Has a small mushy zone (solidus ≈ 217 C, liquidus ≈ 220 C) rather than a sharp eutectic point. Slightly higher resistivity and lower thermal conductivity than Sn63Pb37; mechanically stiffer; requires higher reflow peak temperatures (typically 245-250 C, ~25-30 C above liquidus per IPC J-STD-020).
