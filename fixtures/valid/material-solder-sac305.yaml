# Valid fixture: material definition for SAC305 lead-free solder.
# Sn-Ag-Cu (SAC) alloy, 96.5% tin, 3.0% silver, 0.5% copper by weight.
# RoHS-compliant. The dominant lead-free solder for consumer electronics post-RoHS.
#
# Unlike Sn63Pb37 (a true eutectic), SAC305 has a small mushy zone:
#   solidus  ≈ 217 C
#   liquidus ≈ 220 C
# The two-phase zone affects reflow profile design (peak temperatures ~245-250 C are
# common, ~25-30 C above liquidus, per IPC J-STD-020 reflow classification).
#
# Alloy composition (96.5% Sn, 3.0% Ag, 0.5% Cu by weight) lives in description/notes
# per the §15 deferred question on composition-by-weight as a structured field.
#
# MUST validate against definition.schema.json.
