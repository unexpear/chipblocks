# Valid fixture: material definition for p-doped silicon — the p-side material
# of silicon PN junctions.
#
# Same base material as the Sprint 4 intrinsic silicon entry, doped p-type via
# boron acceptor atoms. The most common p-side material in general-purpose
# silicon diodes (PN rectifiers, Zeners), BJT p-regions (emitter or collector
# depending on NPN/PNP), and MOSFET p-channels / substrates / wells.
#
# Hole mobility in silicon is about 1/3 of electron mobility (typical
# semiconductor trait), so p-type silicon has higher resistivity than n-type
# at the same doping concentration.
#
# Used by: diode_silicon_rectifier (S8-v3-4), diode_zener_silicon (S8-v3-6).
# Not used by Schottky — Schottky junctions are metal-semiconductor, not PN.
# Future devices using silicon p-type: BJT p-regions, PMOSFET sources/drains,
# CMOS p-wells, silicon-controlled rectifiers (SCRs).
#
# MUST validate against definition.schema.json.
