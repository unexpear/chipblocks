name: "Silicon, p-type (Si doped with boron acceptors)"
description: "Group IV semiconductor element doped p-type via boron acceptor atoms. Holes are the majority charge carrier. Same indirect 1.12 eV bandgap as intrinsic and n-type silicon — doping does not change the bandgap, only the Fermi level position and the majority-carrier type. The standard p-side material for silicon diodes, BJT p-regions, and MOSFET substrates."
