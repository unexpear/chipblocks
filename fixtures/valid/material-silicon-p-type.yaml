notes: |
  Doping: nominal acceptor concentration 1e16 to 1e19 per cubic centimeter via
  boron. Aluminum and gallium are alternative p-type dopants for silicon but
  boron is dominant in mainstream silicon processes (better diffusion control,
  shallower junctions, lower segregation coefficient).
  Hole mobility is approximately 3x lower than electron mobility in silicon —
  a typical Group IV semiconductor trait. This is why p-type resistivity is
  higher than n-type at the same doping concentration, and one reason PMOS
  transistors are slower than NMOS at the same channel geometry.
  No direct_bandgap capability — silicon's indirect bandgap is unchanged by
  doping type.
