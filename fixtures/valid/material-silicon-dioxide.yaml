      title: Amorphous SiO2 (fused silica / thermal oxide) density ~2.2 g/cm3
      citation: "CRC Handbook of Chemistry and Physics — fused silica density 2.196 g/cm3; thermal oxide ~2.2 g/cm3"
      confidence: high
    support:
