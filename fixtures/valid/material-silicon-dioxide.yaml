  user_extensible: true
  allowed_origins: [builtin, community, user_local, project]
notes: |
  Thermally grown amorphous SiO2 — the form that sits under a MOSFET gate.
  Crystalline quartz has anisotropic, slightly different values and is NOT this
  entry. Modern sub-100nm processes replace pure SiO2 with high-k dielectrics
  (HfO2 class) precisely because thinning SiO2 further runs into tunneling —
  those become separate material definitions when chip-level modeling needs
  them. The dielectric_strength entry is the physics behind every MOSFET
  datasheet's absolute-maximum gate-source voltage.
