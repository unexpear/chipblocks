# Valid fixture: the Diodes Incorporated AP2112K-3.3 low-dropout linear regulator in SOT25 — the
# 3.3 V rail on a small FPGA board.
#
# Unlike the FPGA and the flash beside it, this part's behaviour IS a device property: it holds its
# output at 3.3 V and drops the difference as heat. That is solvable physics, and a future increment
# could give it a real model. It is marked defined_not_solved TODAY because ChipBlocks has no regulator
# element yet — an honest "not implemented", not an honest "unmodellable".
#
# SOURCE:
#   [DS] Diodes Incorporated, "AP2112 — 600mA CMOS LDO Regulator with Enable", document DS39724
#        Rev. 2-2, June 2017. This is the current revision served at the canonical Diodes URL.
#        Corroborated for the package by the standalone Diodes document "SOT25 Package Information",
#        Rev. 2017-04-11, April 2017, p. 1 — number for number.
# MUST validate against definition.schema.json.
kind: assembly
id: regulator_ap2112k_33_sot25
origin: builtin
layer: assembly
name: Diodes AP2112K-3.3 LDO Regulator (SOT25)
description: A 600 mA low-dropout linear regulator fixed at 3.3 V, in a five-pad SOT25. Takes an input between 4.3 V and 6 V and holds its output steady, burning the difference as heat — which is why its thermal resistance matters as much as its electrical rating. Has an enable pin, so a second regulator's enable can be driven from this one's output to sequence two rails.
