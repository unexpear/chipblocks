notes: |
  DECOUPLING, as actually specified: CIN = 1.0 uF and COUT = 1.0 uF, both ceramic, shown in the
  Typical Applications Circuit on p. 2 and echoed by the features bullet "Stable with 1.0uF Flexible
  Cap". That is the whole of what Diodes states.

  WHAT IS HONESTLY ABSENT — searched for and not published:
    - Minimum or maximum output capacitance, and the ESR window over which the part is stable. Only
      the single 1.0 uF figure appears. Nor does the datasheet say whether 1.0 uF means nameplate or
      effective capacitance after DC-bias derating, which for a small ceramic is a large difference.
      THE TRAP, named so nobody falls into it later: the sibling AP2127 (Diodes DS36478 Rev. 4-2,
      February 2014, p. 11) publishes exactly the missing data — two plots titled "Region of Stable
      COUT ESR vs. Output Current" at COUT = 1 uF and 4.7 uF. Same manufacturer, same product line,
      one search away, and copying them onto the AP2112 would be a fabrication. They describe the
      AP2127. What IS sourced for the AP2112 is only the qualitative claim: Diodes calls it "stable
      with 1.0uF flexible cap", "flexible cap" being the industry term for a regulator designed to be
      insensitive to output-capacitor ESR rather than needing a specific ESR window.
    - Output ramp RATE. Not the same as the start-up time now recorded above: tS = 20 us bounds how
      long the part takes to come alive, but says nothing about the SLEW of the output during that
      time, which is what the iCE40UP5K's monotonic 0.6-10 V/ms ramp requirement (FPGA-DS-02008-2.4
      section 4.3, Table 4.3, p. 30) is about. The AP2112 has NO soft-start and publishes no ramp or
      slew figure, so whether it meets the FPGA's ramp window cannot be settled from the datasheet —
      it is dominated in practice by the output capacitor and load, not the regulator. The sibling
      AP2127 does specify a 50 us soft start, but that is a different part and not transferable.
    - Power-supply rejection above 1 kHz. Specified only at 100 Hz and 1 kHz (65 dB typical at both).
      If a design leans on this LDO to clean up switching noise ahead of the FPGA's PLL filter, the
      datasheet does not support that expectation.
    - Any power-good or reset output. The part has none, so sequencing between rails must be arranged
      externally — typically by driving the second regulator's enable from this one's output.
    - The mapping from the SOT25 outline's letter callouts (A, B, C, D, H, J, K, L, M, N) to named
      features. Neither Diodes document defines them in text, so no body length-versus-width claim is
      made here. The pad-layout numbers ARE named in their own table and are recorded above.

  WHY defined_not_solved: a linear regulator is genuinely solvable — it is a controlled source with a
  dropout floor and a thermal limit — but ChipBlocks has no regulator element today. This is the
  honest "not implemented yet" case, and it is the most likely of these four parts to gain a real
  model, since everything needed for one is cited above.
