terminals:
  vin:
    description: Input supply, pad 1. Wants 1.0 uF of ceramic close by.
  gnd:
    description: Ground, pad 2.
  en:
    description: Chip enable, pad 3. High runs the regulator, low shuts the output down. Has an internal 3.0 Mohm typical pull-down, so a floating enable holds the part OFF rather than leaving it undefined — deliberate, and useful for rail sequencing.
  nc:
    description: No connection, pad 4. Not internally bonded; safe to leave unrouted or use as a via anchor.
  vout:
    description: Regulated 3.3 V output, pad 5. Wants 1.0 uF of ceramic close by.
