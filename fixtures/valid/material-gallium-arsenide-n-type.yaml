notes: |
  GaAs is the canonical near-IR LED material. Pure GaAs LEDs emit ~870-940 nm
  (invisible to human eye but well within the response range of silicon
  photodetectors, which is why GaAs IR LEDs + silicon photodiodes pair well in
  optocouplers and remote-control sensors).
  Beyond LEDs, GaAs is foundational for high-frequency electronics (HEMTs,
  pHEMTs in mobile phones, satellite communications), solar cells (multi-junction
  GaAs cells reach ~40% efficiency under concentrated sunlight), and laser
  diodes (telecom 850 nm short-haul fiber).
  AlGaAs (Aluminum Gallium Arsenide) is a related material that adjusts the
  bandgap upward via Al fraction — used for red LEDs (early generations), red
  laser diodes (DVD players), and heterostructure cladding around GaAs active
  layers. AlGaAs is not yet in the catalog; future addition.
  Substrate: GaAs is typically grown on GaAs wafers (lattice-matched, lowest
  defect density) but can also be grown heteroepitaxially on Ge or Si substrates
  for cost/scale reasons (with lattice-mismatch dislocations).
