# Valid fixture: material definition for n-doped Gallium Arsenide (GaAs),
# the canonical material system for near-IR LEDs (~870 nm) and high-frequency
# electronics. GaAs is the second-most-used semiconductor after silicon for
# III-V applications.
#
# Bandgap is 1.42 eV (direct) — making it LED-suitable (unlike silicon at
# 1.12 eV indirect). Emission wavelength of pure GaAs LEDs is around 870-940 nm
# (near-infrared, invisible to humans but used in TV remotes, optocouplers, IR
# illuminators for night vision, fiber-optic short-haul, proximity sensors).
#
# n-type doping via silicon donors (most common) or tellurium. GaAs's standout
# property is its extraordinarily high electron mobility (~8500 cm^2/V-s at low
# doping) — far higher than silicon (~1350) or InGaN (~150). This makes GaAs
# the material of choice for high-frequency transistors (MESFETs, HEMTs) and
# microwave electronics, even when LED applications aren't the goal.
#
# Used by: future IR LED instances overriding the generic `led` device's
# defaults. Also future Schottky variant (Sprint 8's diode_schottky_al_si has
# silicon; GaAs Schottky has even faster recovery and is common in RF / high-
# voltage applications). Future high-frequency transistors (HEMTs).
#
# MUST validate against definition.schema.json.
