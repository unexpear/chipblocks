notes: |
  Nichrome's resistive-heating utility derives from the combination of high resistivity
  (~65x copper), low temperature coefficient, and oxidation resistance — not from any
  single capability. Specific behaviors (heats_when_current_flows, etc.) attach to the
  resistor primitive device in S4-v3-6, not to the material itself.
