# Valid fixture: material definition for Nichrome 80/20 (Ni 80% / Cr 20% resistive alloy).
# The canonical resistive-heating alloy. High resistivity, oxidation-resistant up to high
# temperatures, very low temperature coefficient of resistance — used for heating elements,
# precision metal-film resistors, and thick-film resistor pastes.
#
# Alloy composition (80% Ni, 20% Cr by weight) is described in this fixture's notes/description
# rather than a structured field. Composition-by-weight as a schema field is a §15
# deferred question — see OBJECT-MODEL.md §15.
#
# MUST validate against definition.schema.json.
kind: material
id: nichrome
origin: builtin
layer: material
name: Nichrome 80/20 (Ni 80% / Cr 20% resistive alloy)
description: Nickel-chromium alloy, nominally 80% nickel and 20% chromium by weight (designated Type A per ASTM B344). The canonical material for resistive heating elements (toasters, kilns, hairdryers) and precision wire-wound resistors. High resistivity, very low temperature coefficient of resistance, and oxidation resistance up to about 1150 C.
