kind: material
id: copper
origin: builtin
layer: material
name: Copper (Cu)
description: Electrically and thermally conductive metallic element. Standard conductor for wires, traces, contacts.
composition:
  uses: []
enables:
  - electrical_conduction
  - thermal_conduction
properties:
  resistivity:
    value:
      kind: condition_bound
      amount: 1.68e-8
      unit: ohm_meter
      conditions:
        temperature:
          amount: 20
          unit: degC
    provenance:
      source_type: reference
      title: Copper electrical resistivity at 20 C
      citation: "CRC Handbook of Chemistry and Physics, 102nd ed. (high-conductivity copper ~1.68e-8 ohm-m at 20 C). NOTE: the IACS / IEC 60028 annealed-CONDUCTOR standard defines 1.7241e-8 ohm-m; this high-purity figure sits at the low end of copper's 1.65-1.72e-8 range."
      confidence: high
    support:
      model_status: defined
      solver_status: not_applicable
  density:
    value:
      kind: condition_bound
      amount: 8960
      unit: kg_per_m3
      conditions:
        temperature:
          amount: 20
          unit: degC
    provenance:
      source_type: reference
      title: Copper density at 20 C
      citation: "CRC Handbook of Chemistry and Physics, 102nd ed."
      confidence: high
    support:
      model_status: defined
      solver_status: not_applicable
  temperature_coefficient_of_resistance:
    value:
      kind: condition_bound
      amount: 0.00393
      unit: per_degC
      conditions:
        temperature:
          amount: 20
          unit: degC
    provenance:
      source_type: standard
      title: Copper temperature coefficient of resistance at 20 C
      citation: "IEC 60028 / CRC Handbook: annealed copper alpha = 0.00393 /degC near 20 C — resistance rises about 0.39% per degree; used with resistivity to give rho(T) = rho20*(1 + alpha*(T-20))."
      confidence: high
    support:
      model_status: defined
