    provenance:
      source_type: reference
      title: Copper thermal conductivity near room temperature
      citation: "CRC Handbook of Chemistry and Physics, 102nd ed. (pure copper ~401 W/m-K at 300 K); commercial copper foil runs ~385-400 W/m-K."
