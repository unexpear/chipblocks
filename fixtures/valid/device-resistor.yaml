# Valid fixture: generic resistor primitive device.
# A two-terminal passive device with a controlled, specified resistance value.
# Implemented in many physical forms (carbon film, metal film, wirewound nichrome,
# thick-film, thin-film, ruthenium oxide) — all reduce to the same electrical model:
# a current-limiting / voltage-dropping element governed by Ohm's law (V = I·R) with
# Joule heating dissipated through the body and leads.
# Resistance can be DECLARED (parameters.resistance — typical for buying a 1 kΩ part)
# or DERIVED (properties.resistance — the R = ρL/A formula evaluated per-instance
# from the resistive_material's resistivity + geometry's length + cross-section
# area). Both paths land in v3 Sprint 12; the equation value kind formalizes the
# derived path. See OBJECT-MODEL.md §16.
# MUST validate against definition.schema.json.
kind: primitive_device
id: resistor
origin: builtin
layer: primitive_device
name: Resistor
description: A two-terminal passive device with a specified resistance. Used to limit current, drop voltage, divide voltage, set bias points, terminate transmission lines, and convert current to voltage (across a sense resistor). Implementations vary widely (carbon film, metal film, wirewound, thick-film, thin-film), but all reduce to the same electrical model — Ohm's law and Joule heating.
composition:
  requires:
    resistive_material:
      kind: material
      must_enable:
        - electrical_conduction
    geometry:
      kind: shape
      must_enable:
        - path_role
    endpoints:
      kind: interface
      min_count: 2
parameters:
  resistive_material:
    type: material_ref
    satisfies_role: resistive_material
    required: true
    description: The resistive material that determines the resistor's electrical and thermal properties.
  geometry:
    type: shape_ref
    satisfies_role: geometry
    required: true
    default:
      value: path
  resistance:
    type: quantity
    units: ohm
    required: true
    description: The declared resistance value of this resistor.
  tolerance_percent:
    type: quantity
    units: percent
    required: false
    description: Resistance tolerance as a percent of nominal (e.g., 1%, 5%).
  power_rating:
    type: quantity
    units: watt
    required: false
    description: Maximum continuous power dissipation under specified ambient conditions.
  temperature_coefficient:
    type: quantity
    units: per_kelvin
    required: false
    description: Fractional change in resistance per unit temperature change near the operating point.
  thermal_resistance_junction_ambient:
    type: quantity
    units: kelvin_per_watt
    required: false
    description: Junction-to-ambient thermal resistance (θ_JA) of the package — the lumped thermal model's slope, T = T_ambient + P·θ_JA. Datasheet-specified per package class.
  max_operating_temperature:
    type: quantity
    units: celsius
    required: false
    description: Maximum part/junction operating temperature. The stage-7 thermal check fires when the computed steady-state temperature exceeds it.
properties:
  resistance:
    value:
      kind: equation
      expression: "rho * L / A"
      inputs:
        rho:
          kind: property_ref
          path: resistive_material.resistivity
        L:
          kind: property_ref
          path: geometry.length
        A:
          kind: property_ref
          path: geometry.cross_section_area
      output_unit: ohm
      notes: "Derived form of R. The instance's resistive_material role provides ρ (resistivity); the instance's geometry role provides L (length) and A (cross-section area). The declared form via parameters.resistance is also supported; instances pick one path. Per OBJECT-MODEL.md §16."
    provenance:
      source_type: reference
      title: "Standard resistor equation R = ρL/A"
      citation: "Sze and Ng, Physics of Semiconductor Devices, 3rd ed., ISBN 978-0-471-14323-9, §1.6; CRC Handbook of Chemistry and Physics, 102nd ed., standard electrical engineering formulas"
      confidence: high
behaviors:
  - conducts_current
  - has_resistance
  - produces_joule_heat
terminals:
  terminal_a:
    description: One end of the resistive element.
  terminal_b:
    description: The other end of the resistive element.
support:
  model_status: defined
  solver_status: builtin_simple
extensions:
  overridable: true
  user_extensible: true
  allowed_origins: [builtin, community, user_local, project]
