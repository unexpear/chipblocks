# Valid fixture: a 470 ohm 5 W wirewound resistor instance using nichrome — the
# LED current-limiting resistor for the educational anchor circuit.
# S7-v3-6: connects: wires this resistor between switch_001 (input from the
# switch's output) and led_001 (output to the LED's anode). At 9 V supply with a
# ~2.0 V red LED drop, ~7 V is left across the resistor:
#   I = (9 - 2) / 470 ≈ 15 mA — a safe, textbook value for a 20 mA LED. The
# standard 9 V LED-resistor result is ~350 ohm; 470 ohm is the next conservative
# E12 value (~15 mA), so the LED runs well within its rating and lights normally.
# (Wirewound 5 W is over-spec for this ~0.1 W load but a valid real part; nichrome
# is the catalog's only resistive material for now.)
# MUST validate against instance.schema.json.
kind_ref: primitive_device
definition: resistor
id: resistor_001
origin: project
parameters:
  resistive_material:
    value: nichrome
  geometry:
    value: path
  resistance:
    value:
      kind: scalar
      amount: 470
      unit: ohm
  tolerance_percent:
    value:
      kind: scalar
      amount: 5
      unit: percent
  power_rating:
    value:
      kind: scalar
      amount: 5
      unit: watt
# No per-instance geometry: this resistor TRUSTS its declared 100 ohm. The
# derived R = rho*L/A cross-check (resistor definition) is opt-in — it only fires
# if an instance is deliberately given geometry.length + geometry.cross_section_area
# (see the cross-fk "FIRES when given geometry" test). Without them it skips, and
# the declared value stands.
connects:
  - net: net_switch_resistor
    terminal: terminal_a
    of: resistor_001
  - net: net_resistor_led
    terminal: terminal_b
    of: resistor_001
