terminals:
  standby:
    description: Standby / output enable, pad 1. High (at least 0.7 x Vdd) or left OPEN lets it oscillate; low stops the output. Note the open state runs — an unconnected pad does not silence the part.
  gnd:
    description: Ground, pad 2. Also the package case connection.
  output:
    description: CMOS clock output, pad 3.
  vdd:
    description: "Supply, pad 4. Abracon specifies one bypass capacitor and nothing else — verbatim, datasheet p. 5 note 1: 'Recommend using an approximately 0.01uF bypass capacitor between PIN 2 and 4.'"
