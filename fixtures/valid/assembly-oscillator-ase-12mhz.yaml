# Valid fixture: the Abracon ASE-series 12.000 MHz CMOS crystal oscillator, 3.2 x 2.5 mm — the clock
# source on a small FPGA board.
#
# This is a complete oscillator, not a bare crystal: the resonator and its drive circuit are inside the
# can, so it needs only a supply and produces a CMOS square wave. That is why it has four pads rather
# than two.
#
# SOURCE:
#   [DS] Abracon LLC, "3.3V CMOS Compatible 3.2 x 2.5mm SMD Crystal Oscillator — ASE Series",
#        REVISED 02-18-22 (the revision date printed in the footer of all six pages). Abracon prints
#        no document number; the series name and that date identify it.
# MUST validate against definition.schema.json.
kind: assembly
id: oscillator_ase_12mhz
origin: builtin
layer: assembly
name: Abracon ASE 12.000 MHz Crystal Oscillator (3.2 x 2.5 mm)
description: A packaged 12 MHz crystal oscillator with a CMOS output — resonator and drive circuit sealed in one ceramic package, so a board needs only to feed it 3.3 V and take the square wave out. Four pads, one of which is a standby input that stops the output when pulled low. The part most small FPGA boards use for their system clock.
