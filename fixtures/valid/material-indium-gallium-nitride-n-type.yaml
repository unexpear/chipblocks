# Valid fixture: material definition for n-doped Indium Gallium Nitride (InGaN),
# the dominant material system for blue and green LEDs.
#
# Composition is nominally In_x Ga_{1-x} N where x is tuned for the desired
# bandgap / emission wavelength:
#   - x ~ 0.10-0.20 -> bandgap ~2.7 eV -> blue (~460 nm)
#   - x ~ 0.25-0.35 -> bandgap ~2.4 eV -> green (~520 nm)
# At the SPICE/EDA circuit-modeling layer (verified against Wikipedia LED
# article 2026-06-05), InGaN is treated as ONE material system spanning these
# compositions; specific In fraction is captured at the LED-instance level via
# wavelength + forward voltage parameter overrides rather than separate material
# entries per color.
#
# n-type doping via silicon donors (highly activated — n-InGaN is well-behaved
# electrically). Carrier mobility is much lower than GaAs because of phonon
# scattering and alloy scattering inherent to the nitride lattice, but
# sufficient for LED operation.
#
# Used by: future LED instances overriding the generic `led` device's
# n_side / p_side defaults to switch from red AlGaInP to blue/green InGaN.
# Sprint 10 lands the material; instances + UV-LED separate device come in a
# subsequent sprint plan.
#
# MUST validate against definition.schema.json.
kind: material
