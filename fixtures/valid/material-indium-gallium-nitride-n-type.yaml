notes: |
  Composition tunability: In fraction x in In_x Ga_{1-x} N determines bandgap
  and emission wavelength. Industry uses ONE material system at SPICE/EDA
  layer (this entry); the LED instance's peak_wavelength + forward_voltage
  parameters capture the In-fraction variation. When heterostructure / QW
  active-layer modeling lands (§15 deferred), the LED structure becomes
  explicit (n-GaN cladding + InGaN MQW active + p-GaN cladding) and specific
  In fractions move into the active-layer material definitions.
  Real LED epitaxy: typically n-GaN buffer + InGaN multi-quantum-well (MQW)
  active layer + p-GaN cladding, grown on sapphire (most common) or SiC
  substrate. The simple PN-junction model used here glosses over the active
  layer; verified industry-standard at the circuit modeling layer.
