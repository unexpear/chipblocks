name: "InGaN, n-type (In_x Ga_{1-x} N doped n-type)"
description: "Wide-bandgap III-nitride compound semiconductor doped n-type with silicon donors. Direct bandgap tunable between ~2.0 eV (high In, longer wavelengths) and ~3.4 eV (pure GaN, UV) depending on indium fraction x. The blue-to-green LED working range (x ~ 0.10-0.35) gives bandgaps ~2.4-2.7 eV and emission ~460-520 nm. The dominant material system for blue, green, and white LEDs (white via blue InGaN + phosphor)."
