# Valid fixture: red LED primitive device built on the AlGaInP material system.
# composition.uses both AlGaInP variants directly (implicit PN junction —
# pn_junction-as-interface defers to Sprint 8+ once 2+ semiconductor devices
# exist).
#
# This is a SPECIFIC LED variant (per the Sprint 6 naming lesson) — the junction
# materials are part of the definition's identity. Future LED variants follow
# the same pattern: led_blue_ingan (InGaN), led_green_ingan, led_ir_gaas,
# led_uv_algan, led_white_phosphor_converted.
#
# Forward voltage ~1.9-2.2 V at typical operating current (~20 mA). Peak
# emission wavelength ~625-650 nm (red). The Shockley diode equation
# (acts_as_diode behavior) governs the I-V curve; radiative recombination
# (emits_light behavior) governs photon output.
#
# MUST validate against definition.schema.json. Cross-FK confirms the PN
# materials exist and enable their respective doping-type capabilities.
kind: primitive_device
id: led_red_algainp
origin: builtin
layer: primitive_device
name: "Red LED (AlGaInP, ~640 nm)"
description: "A two-terminal light-emitting diode built on the AlGaInP material system, optimized for red light emission around 640 nm. Forward-biased current driven through the PN junction produces photons via radiative recombination. The forward voltage drop (~2.0 V typical) and peak emission wavelength are determined by the junction's bandgap energy. Common in indicator lights, hobbyist projects, 7-segment displays, decorative lighting, and traffic signals."
composition:
  uses:
    - aluminum_gallium_indium_phosphide_n_type
    - aluminum_gallium_indium_phosphide_p_type
  requires:
    endpoints:
      kind: interface
      min_count: 2
parameters:
  forward_voltage:
    type: quantity
    units: volt
    required: true
    description: Voltage drop across the LED at its rated operating current. Determined by the junction's bandgap energy (V_F ~ E_g / e for ideal LEDs). Real LEDs deviate slightly due to series resistance and the diode ideality factor; typical AlGaInP red LEDs sit at 1.9-2.2 V.
  peak_wavelength:
    type: quantity
    units: nanometer
    required: true
    description: Wavelength of peak photon emission. Determined by junction bandgap via wavelength = h*c/E_g. For AlGaInP at the red-LED-targeted composition, this is around 625-650 nm.
  max_forward_current:
    type: quantity
    units: ampere
    required: true
    description: Absolute maximum DC current the LED can sustain continuously without damage. Typical 5 mm through-hole LEDs are rated for 20 mA continuous; higher-power LEDs (1 W, 3 W) go to hundreds of mA or more.
  reverse_breakdown_voltage:
    type: quantity
    units: volt
    required: false
    description: Reverse voltage at which the diode breaks down and may be damaged. Typical for indicator LEDs is 5 V; LEDs are not designed for sustained reverse operation.
  external_quantum_efficiency:
    type: quantity
    units: dimensionless
    required: false
    description: Fraction of forward-current electrons that result in photons escaping the device. Accounts for non-radiative recombination + light extraction efficiency. Modern AlGaInP red LEDs achieve 10-40 percent typically.
  viewing_angle:
    type: quantity
    units: degree
    required: false
    description: Cone half-angle within which the emitted light intensity remains above 50 percent of peak. Determined by the package optics (lens, encapsulant shape), not the chip. Typical 5 mm packages are 15-30 degrees; surface-mount LEDs are often 120 degrees or wider.
behaviors:
  - acts_as_diode
  - emits_light
  - conducts_current
  - has_resistance
  - produces_joule_heat
support:
  model_status: defined
  solver_status: builtin_simple
extensions:
  overridable: true
  user_extensible: true
  allowed_origins: [builtin, community, user_local, project]
notes: |
  Behaviors include conducts_current + has_resistance + produces_joule_heat
  alongside acts_as_diode + emits_light because the LED IS a conductor with
  resistance when forward-biased — Joule heating from the junction's series
  resistance is a real effect and is the main reason high-power LEDs need
  heat-sinking. State-dependent gating (only fire when forward-biased) is
  the §15 deferred 'state-dependent behavior gating' row from Sprint 6.
  Implicit PN junction: composition.uses lists both doped materials directly.
  Future sprints may promote pn_junction to a separate interface kind once
  multiple semiconductor devices (Schottky diode, BJT, MOSFET) want to share
  the junction concept — see §15.
  Forward voltage + peak wavelength are declared parameters today; their
  derivation from the junction bandgap (V_F ~ E_g/e, lambda = h*c/E_g) lands
  with the behavior-derives-value pattern (§15).
