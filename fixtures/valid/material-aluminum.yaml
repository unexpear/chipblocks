# Valid fixture: material definition for aluminum.
# Common conductor for PCB heat sinks, ground planes, package leads, and IC interconnect on legacy nodes.
# About 61% the conductivity of copper (IACS reference), about 30% the density.
# MUST validate against definition.schema.json.
