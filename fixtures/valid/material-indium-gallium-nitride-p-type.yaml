description: "Wide-bandgap III-nitride compound semiconductor doped p-type with magnesium acceptors. Same In-fraction-tunable direct bandgap as the n-type variant (~2.4-2.7 eV in the blue-to-green LED-working range). Holes are the majority carrier, but the deep Mg acceptor level keeps activation efficiency low — resistivity is 10-100x higher than n-type at comparable dopant concentration. Standard p-side material for blue and green InGaN LEDs."
