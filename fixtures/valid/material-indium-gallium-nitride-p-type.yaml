# Valid fixture: material definition for p-doped Indium Gallium Nitride (InGaN).
# The p-side counterpart to material-indium-gallium-nitride-n-type.
#
# p-type doping via magnesium acceptors. The famous challenge of the
# III-nitride material system: Mg acceptors are deep (~170 meV above the
# valence band), so activation efficiency is very low — even with very high
# Mg doping (1e19 to 1e20 per cm^3), the free hole concentration stays around
# 1e17 to 1e18 per cm^3. Result: p-InGaN resistivity is 10-100x higher than
# comparable n-InGaN at similar dopant concentration. This is a hard, well-
# documented industry limitation (the Mg-H activation breakthrough by Akasaki/
# Amano/Nakamura was Nobel-worthy because of it — 2014 Nobel Prize in Physics).
#
# Used by: future LED instances using blue/green InGaN as p_side material.
# MUST validate against definition.schema.json.
