notes: |
  p-type doping in the III-nitride system was the breakthrough that enabled
  practical blue LEDs and earned the 2014 Nobel Prize in Physics (Akasaki,
  Amano, Nakamura). Mg acceptors are deep (~170 meV above the valence band)
  so activation is poor — even with high Mg doping the free hole concentration
  stays low. This is why p-InGaN resistivity is 10-100x higher than n-type
  at comparable dopant concentration, and why InGaN LEDs are inherently
  asymmetric (carriers inject more easily from n-side than p-side).
  Activation step: post-growth thermal annealing at ~700 C is required to
  break Mg-H bonds and activate the acceptors. Modern MOCVD processes have
  refined this substantially since the original 1989-1992 breakthroughs.
  When heterostructure modeling lands (§15 deferred), p-InGaN's specific role
  as the p-side cladding above the InGaN active layer becomes explicit.
