# Valid fixture: P-channel JFET (junction field-effect transistor).
# The mirror of the N-channel JFET: a p-type channel between source and drain,
# with an n-type gate forming a reverse-biased PN junction along it. At zero gate
# bias the channel conducts I_DSS; pulling the gate POSITIVE (toward the positive
# pinch-off voltage V_P) depletes the channel until it pinches off. The gate
# junction is reverse-biased in normal use, so the gate draws no DC current.
#
# Solved by both engines via the same Level-1 square law as the N-channel part
# and the MOSFET (jfet-model.ts, beta = k/2), in the mirrored (p-channel) frame.
#
# Per the device-power-source convention this definition carries NO builtin
# numeric defaults on the electrical parameters — the cited canvas drop defaults
# live in part-defaults.ts (2N5460 class); only the structural material regions
# default here.
#
# MUST validate against definition.schema.json.
kind: primitive_device
id: transistor_jfet_p_channel
origin: builtin
layer: primitive_device
name: "P-channel JFET"
description: "A three-terminal depletion-mode field-effect transistor, the P-channel mirror: gate, drain, source. A p-type channel conducts at zero gate bias (I_DSS); a reverse-biased n-type gate junction pinches it off as V_GS rises to the (positive) pinch-off voltage V_P. The gate draws no DC current in normal operation. Modeled by the shared FET square law (cutoff / triode / saturation, Shichman-Hodges Level 1, with beta = k/2) plus channel-length modulation, in the mirrored frame."
composition:
  uses:
    - pn_junction
  requires:
    channel_region:
      kind: material
      must_enable:
        - p_type_semiconductor
    gate_region:
      kind: material
      must_enable:
        - n_type_semiconductor
    endpoints:
      kind: interface
      min_count: 3
parameters:
  channel_region:
    type: material_ref
    satisfies_role: channel_region
    required: true
    default:
      value: silicon_p_type
    description: The p-type channel that conducts between source and drain.
  gate_region:
    type: material_ref
    satisfies_role: gate_region
    required: true
    default:
      value: silicon_n_type
    description: The n-type gate diffusion; its reverse-biased junction with the channel modulates the channel width.
  pinch_off_voltage:
    type: quantity
    units: volt
    required: true
    description: "Pinch-off (gate cutoff) voltage V_P — POSITIVE for a P-channel JFET (e.g. 2N5460 ~ +2 V typical, +0.75 to +6 V across parts). At V_GS = V_P the channel is fully depleted (cutoff); at V_GS = 0 it conducts I_DSS = beta·V_P^2."
  transconductance:
    type: quantity
    units: ampere_per_volt_squared
    required: true
    description: "The transconductance parameter beta (A/V^2) in |I_D(sat)| = beta·(V_GS - V_P)^2. Equals |I_DSS| / V_P^2; derivable from the datasheet I_DSS and V_GS(off). Shares the MOSFET square law with k = 2·beta."
  channel_length_modulation:
    type: quantity
    units: per_volt
    required: false
    description: "lambda — the slight rise of saturation current magnitude with |V_DS| (finite output resistance). Textbook Level-1 class values 0.01-0.05 per volt."
  max_drain_current:
    type: quantity
    units: ampere
    required: false
    description: Maximum continuous drain current magnitude before thermal damage (for a small-signal JFET, an I_DSS-scale rating).
  thermal_resistance_junction_ambient:
    type: quantity
    units: kelvin_per_watt
    required: false
    description: Junction-to-ambient thermal resistance (theta_JA) of the package — the lumped thermal model's slope, T = T_ambient + P·theta_JA.
  max_operating_temperature:
    type: quantity
    units: celsius
    required: false
    description: Maximum junction operating temperature. The stage-7 thermal check fires when the computed steady-state temperature exceeds it.
behaviors:
  - acts_as_transistor
  - conducts_current
  - produces_joule_heat
terminals:
  gate:
    description: The control terminal — its (reverse, positive) voltage relative to the source sets the channel width. Draws no DC current in normal operation.
  drain:
    description: The terminal conventional current leaves when the channel conducts (P-channel; current flows source to drain).
  source:
    description: The reference terminal the gate and drain voltages are measured against; sits toward the positive rail.
support:
  model_status: defined
  solver_status: builtin_simple
extensions:
  overridable: true
  user_extensible: true
  allowed_origins: [builtin, community, user_local, project]
notes: |
  A p-type channel with an n-type gate junction; depletion mode (on at V_GS = 0,
  off at V_GS = V_P > 0). The N-channel part's mirror, solved by the same shared
  FET square law (jfet-model.ts, beta = k/2) in the pmos frame. Per the
  device-power-source convention, no builtin numeric defaults on pinch-off /
  transconductance (part-specific) — the canvas drop defaults (part-defaults.ts,
  2N5460 class, cited) fill them in; the p/n material regions DO default. NOT
  modeled yet: the gate-channel junction's forward conduction and reverse
  breakdown — the higher-fidelity successor.
