name: "AlGaInP, n-type ((Al,Ga)InP doped n-type)"
description: "Quaternary III-V compound semiconductor doped n-type. Composition is nominally (Al_x Ga_{1-x})_0.5 In_0.5 P with x chosen for the desired bandgap; the red-LED-targeted composition (x ~ 0.0 to 0.3) yields a direct bandgap around 1.9 eV. n-type doping via silicon or tellurium donors. The canonical n-side material for red, orange, and yellow LEDs."
