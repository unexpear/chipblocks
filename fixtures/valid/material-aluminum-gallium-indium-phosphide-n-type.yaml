# Valid fixture: material definition for n-doped AlGaInP (aluminum gallium indium
# phosphide), the canonical material system for red/orange/yellow LEDs.
#
# AlGaInP is a quaternary III-V compound semiconductor with composition
# (Al_x Ga_{1-x})_0.5 In_0.5 P. Lattice-matched to GaAs substrates, with direct
# bandgap making it suitable for radiative recombination (LED light emission).
#
# This entry is the n-type variant — silicon or tellurium dopants donate
# extra electrons. The 'intrinsic AlGaInP' (undoped) is the baseline; n-type
# doping shifts the Fermi level toward the conduction band and drops resistivity
# substantially.
#
# Bandgap ~1.9 eV gives an emission wavelength around 650 nm (red). Tuning the
# Al fraction shifts the bandgap (more Al -> shorter wavelength, up to ~2.3 eV
# for orange/yellow before crossing to indirect bandgap).
#
# MUST validate against definition.schema.json. First compound-semiconductor in
# the catalog; first material with explicit 'semiconductor' and
# 'n_type_semiconductor' capabilities.
kind: material
