notes: |
  Doping: nominal carrier concentration 1e17 to 5e18 per cubic centimeter via
  silicon or tellurium donors. Specific epitaxial doping profiles depend on the
  LED manufacturer's process (MOCVD growth conditions, dopant species).
  Composition tunability: Al fraction x shifts the bandgap. x ~ 0 yields red
  (~650 nm); higher x shifts toward orange (~610 nm) and yellow (~590 nm)
  before crossing to indirect bandgap (no longer LED-suitable) around x ~ 0.5.
  Lattice-matched to GaAs substrate at indium fraction y ~ 0.5.
