terminals:
  vcc:
    description: Core logic supply, 1.2 V nominal. TWO pads on the SG48 — 5 and 30 [UG Figure A.3]. Must rise first, together with VCCPLL.
  vccpll:
    description: Analog supply for the sysCLOCK PLL, 1.2 V nominal, pad 29 [UG Figure A.3]. Tie to the same supply as VCC through an RC noise filter [DS Table 4.2 note 1].
  vccio_0:
    description: Bank 0 I/O driver supply, pad 33 [UG Figure A.3]. An unused bank's VCCIO should be tied to VCC [DS Table 4.2 note 3].
  spi_vccio1:
    description: Bank 1 I/O driver supply, pad 22 [UG Figure A.3]. On UltraPlus the Bank 1 I/O supply IS the SPI configuration supply — the Hardware Checklist calls the same rail SPI_VCC. One of the three rails the power-on-reset actually monitors.
  vccio_2:
    description: Bank 2 I/O driver supply, pad 1 [UG Figure A.3].
  vpp_2v5:
    description: NVCM programming and operating supply, pad 24 [UG Figure A.3]. Needs 2.30 V or more to configure as Master SPI. Monitored by the power-on-reset.
  creset_b:
    description: Active-low configuration reset, pad 8 [UG Figure A.3]. Holding it low and releasing it restarts configuration.
  cdone:
    description: Configuration-done indicator, pad 7 [UG Figure A.3]. Goes high once the bitstream has loaded successfully.
  paddle:
    description: The exposed thermal paddle on the underside — and the ONLY ground connection. The SG48 has no ground pin at all; the datasheet requires the paddle be tied to GND [DS section 5.2 footnote, p. 45]. Ignoring this leaves the part with no return path.
support:
