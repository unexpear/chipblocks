# Valid fixture: the Lattice iCE40UP5K in the SG48 (48-pin QFN) package — a SPECIFIC, purchasable
# part, and the first entry in the catalog at the ASSEMBLY layer.
#
# WHY THIS IS NOT A PLACEHOLDER. ChipBlocks cannot simulate what is inside an FPGA: its behaviour is
# whatever bitstream you load into it, which is a design, not a device property. Per OBJECT-MODEL.md §10
# that is exactly what `solver_status: defined_not_solved` is for — "this physics is real, ChipBlocks
# knows about it, the solver does not handle it yet." What IS modelled here is everything true of the
# part at its TERMINALS regardless of the bitstream: the supply rails it needs, the order they must come
# up in, the package it lands in, and the pads it solders to. Those are the facts a board needs, and
# every one of them is cited to a primary Lattice document below.
#
# SOURCES (all Lattice Semiconductor, all primary):
#   [DS]   iCE40 UltraPlus Family Data Sheet, FPGA-DS-02008-2.4, February 2025 — electrical values.
#          NOTE: revision 2.4 is current and MATTERS. Rev 2.0 (August 2021) gave VCCIO min as 1.71 V;
#          rev 2.4 lowered it to 1.20 V (its own Revision History, p. 46: "Updated the min value of
#          VCCIO from 1.7 V to 1.20 V"). Shipping the older number would misstate the part.
#   [UG]   iCE40 UltraPlus Breakout Board User Guide, FPGA-UG-02001-1.2, April 2022 — PIN NUMBERS.
#          The datasheet deliberately carries none: its §5.2 gives only per-package COUNTS and directs
#          the reader to "the device pinout file from the Lattice website for exact pin locations".
#          Figure A.3 "DUT Connection" (p. 27) is a schematic of a real Lattice-built board and names
#          each numbered pin of the SG48 part directly.
#   [PKG]  Package Diagrams, pkg_5.4, November 2017, "48-Pin QFN Package Option 2" (p. 32) — outline.
#   [TN12] PCB Layout Recommendations for Leaded Packages, TN1257 (tn1257_01.3), October 2013,
#          Figure 18 "QFN Footprints", 48 QFN sub-figure (p. 9) — the PCB land pattern.
#   [TN02] iCE40 Hardware Checklist, FPGA-TN-02006-2.3, April 2024 — sequencing + rail accuracy.
# MUST validate against definition.schema.json.
kind: assembly
id: fpga_ice40up5k_sg48
origin: builtin
layer: assembly
name: Lattice iCE40UP5K-SG48 FPGA
description: A 5280-LUT field-programmable gate array in a 48-pin QFN, 7 mm square. What it DOES is set by the configuration bitstream loaded into it at power-up, so this entry models the part at its terminals — the rails it needs, the sequence they must rise in, and the pads it solders to — not its internal logic. Three I/O banks, 39 user I/O in this package, and a ground that exists only as the exposed paddle underneath.
