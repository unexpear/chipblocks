# Valid fixture: generic capacitor primitive device.
# A two-terminal passive device storing electric energy in the electrostatic field between
# two conductive plates separated by a dielectric. Realized in many physical forms (ceramic,
# electrolytic, film, tantalum, supercapacitor) — all reduce to the parallel-plate lumped
# model: C = ε * A / d.
# First device to exercise composition.requires.<role>.min_count: 2 (the plates role) and
# the first device to use a dielectric-material role with must_enable: [dielectric_insulation].
# Capacitance can be DECLARED directly (as in this Sprint 4 model) or DERIVED from
# permittivity × area / separation — the derivation pattern is a Sprint 4 open question.
# MUST validate against definition.schema.json.
kind: primitive_device
id: capacitor
origin: builtin
layer: primitive_device
name: Capacitor
description: A two-terminal passive device with a controlled capacitance. Stores electric energy in the field between two conductive plates separated by a dielectric. Used for filtering, energy buffering, AC coupling, decoupling, timing, tuning, and snubbing across nearly every electronic circuit. Implementations vary (ceramic MLCC, aluminum electrolytic, film, tantalum, supercapacitor) but all reduce to the parallel-plate model at the lumped level.
composition:
  requires:
    plates:
      kind: shape
      must_enable:
        - plate_role
      min_count: 2
    dielectric:
      kind: material
      must_enable:
        - dielectric_insulation
    endpoints:
      kind: interface
      min_count: 2
parameters:
  plates:
    type: shape_ref
    satisfies_role: plates
    required: true
    default:
      value: plate
    description: The shape type used for the conductive plates. The cross-FK validator verifies the chosen shape enables plate_role. The plate count (min_count 2) is structurally enforced by the future net model.
  dielectric:
    type: material_ref
    satisfies_role: dielectric
    required: true
    description: The dielectric material separating the plates. Must enable dielectric_insulation.
  capacitance:
    type: quantity
    units: farad
    required: true
    description: The declared capacitance value of this capacitor.
  voltage_rating:
    type: quantity
    units: volt
    required: false
    description: Maximum voltage that can be safely applied across the terminals before dielectric breakdown.
  tolerance_percent:
    type: quantity
    units: percent
    required: false
    description: Capacitance tolerance as a percent of nominal.
behaviors:
  - has_capacitance
  - stores_charge
support:
  model_status: defined
  solver_status: builtin_simple
extensions:
  overridable: true
  user_extensible: true
  allowed_origins: [builtin, community, user_local, project]
