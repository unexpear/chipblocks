# Valid fixture: material definition for p-doped AlGaInP — the p-side counterpart
# to material-aluminum-gallium-indium-phosphide-n-type.
#
# p-type doping uses zinc or magnesium acceptors that take electrons from the
# valence band, leaving mobile holes as the majority charge carrier. Combined
# with the n-type variant in a PN junction, p-AlGaInP forms the device for
# radiative recombination — when forward-biased current drives electrons from
# the n-side into the p-side, electrons and holes recombine and emit photons
# at energy E_g ~ 1.9 eV (red light around 650 nm).
#
# Hole mobility in AlGaInP is significantly lower than electron mobility (a
# typical III-V trait), so p-type resistivity is higher than n-type at
# comparable doping.
#
# MUST validate against definition.schema.json.
