notes: |
  Doping: nominal acceptor concentration 1e17 to 5e18 per cubic centimeter via
  zinc or magnesium acceptors. Zinc is most common in production AlGaInP LEDs;
  magnesium is used in some processes for tighter activation control.
  Hole mobility is substantially lower than electron mobility (typical III-V
  phosphide characteristic), which is why p-type AlGaInP has higher resistivity
  than n-type at the same doping concentration.
