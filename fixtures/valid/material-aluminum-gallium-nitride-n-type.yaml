notes: |
  Composition tunability: Al fraction x determines bandgap and emission
  wavelength. Higher Al gives shorter wavelengths but also poorer carrier
  transport and dimmer LEDs (the "deep-UV efficiency cliff"). This is one
  reason UV LEDs deserve their own device definition (`led_uv_algan` in a
  future sprint) — the trade-offs are wavelength-dependent in a way that
  visible LEDs don't share.
  Substrate: AlGaN is typically grown on sapphire (most common) or AlN
  templates. Lattice mismatch with sapphire generates threading dislocations
  that limit lifetime. AlN-on-sapphire templates reduce defects substantially
  but at higher cost.
  Doping notes: Si donors have an activation energy of ~40 meV in pure GaN
  but rise to ~200 meV in pure AlN. At high Al fractions (deep UV), the
  ionized donor concentration becomes much lower than the dopant concentration,
  driving resistivity up rapidly. This is the equivalent of the well-known
  p-InGaN activation problem but for n-type AlGaN.
extensions:
