# Valid fixture: material definition for n-doped Aluminum Gallium Nitride (AlGaN),
# the material system for UV LEDs spanning near-UV (~365 nm) to deep-UV (~210 nm)
# depending on Al fraction.
#
# Composition is Al_x Ga_{1-x} N where x is tuned for the desired bandgap /
# emission wavelength:
#   - x = 0 (pure GaN) -> bandgap 3.4 eV -> UV-A (~365 nm)
#   - x ~ 0.4-0.5 -> bandgap ~4.5 eV -> UV-B/UV-C (~280-310 nm, sterilization)
#   - x = 1 (pure AlN) -> bandgap 6.0 eV -> deep UV (~210 nm)
#
# n-type doping via silicon donors works reasonably well across the composition
# range, though carrier concentration drops at high Al fractions due to
# increasing donor activation energy. AlGaN's wide direct bandgap and modest
# (but useful) electron mobility make it the dominant material for UV LED
# applications.
#
# Used by: future UV LED instances. UV LEDs deserve their own device
# definition (`led_uv_algan`) rather than being instances of the generic `led`
# because of lifetime, eye-safety, and wavelength-dependent caveats. Sprint 10
# lands the material; the UV-LED device + instance come in a subsequent sprint
# plan.
#
# MUST validate against definition.schema.json.
