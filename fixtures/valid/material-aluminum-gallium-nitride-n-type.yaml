description: "Wide-bandgap III-nitride compound semiconductor doped n-type with silicon donors. Direct bandgap tunable between 3.4 eV (pure GaN at x = 0, UV-A near 365 nm) and 6.0 eV (pure AlN at x = 1, deep UV near 210 nm) depending on aluminum fraction x. The dominant material system for UV LEDs across the near-UV, UV-B, and UV-C ranges — used in sterilization, water treatment, surface curing, fluorescence detection, and counterfeit-currency verification."
