notes: |
  Doping: Zn is the dominant p-type dopant for GaAs (shallow acceptor, well-
  activated, easy to incorporate during MOCVD growth). Be is sometimes used in
  MBE-grown structures (avoids Zn diffusion issues at narrow junctions). Carbon
  is used in HBT emitter caps (very shallow, ultra-high concentrations possible).
  p-type GaAs is electrically well-behaved — unlike the p-InGaN case where deep
  Mg acceptors limit activation. This is why GaAs-based devices (HBTs, IR LEDs,
  solar cells) achieved commercial maturity decades before InGaN-based devices.
  Hole mobility is ~20x lower than electron mobility in GaAs (typical III-V
  trait: heavy hole effective mass), but still 4-5x higher than p-InGaN.
