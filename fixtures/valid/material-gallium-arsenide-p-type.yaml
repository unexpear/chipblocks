# Valid fixture: material definition for p-doped Gallium Arsenide (GaAs).
# The p-side counterpart to material-gallium-arsenide-n-type.
#
# p-type doping via zinc (most common) or beryllium acceptors. Unlike InGaN,
# GaAs p-type doping is straightforward — Zn acceptors are shallow and well-
# activated. p-GaAs resistivity is comparable to n-GaAs at similar doping
# (within ~3-5x), unlike the 10-100x ratio in p-InGaN.
#
# Used by: future IR LED instances. Also future PNP / NPN transistors on GaAs
# substrates (BJT, HBT — heterojunction bipolar transistors).
# MUST validate against definition.schema.json.
