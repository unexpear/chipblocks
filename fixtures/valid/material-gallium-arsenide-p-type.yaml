name: "GaAs, p-type (Gallium Arsenide doped p-type)"
description: "Group III-V direct-bandgap compound semiconductor doped p-type with zinc or beryllium acceptors. Holes are the majority carrier. Same direct 1.42 eV bandgap as n-type GaAs and intrinsic GaAs. Unlike p-InGaN, p-type doping in GaAs is well-behaved electrically: shallow Zn/Be acceptors give good activation, so p-GaAs resistivity stays close to n-GaAs at comparable doping. The standard p-side material for GaAs IR LEDs, HBT base regions, and GaAs solar cell emitters."
