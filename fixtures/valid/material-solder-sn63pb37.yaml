notes: |
  Composition by weight: 63% Sn, 37% Pb (eutectic). Structured composition-by-weight
  schema field is a §15 deferred question — current description/notes capture is the
  workaround.

  Regulatory status: NOT RoHS-compliant (contains lead). Permitted under specific RoHS
  exemptions for aerospace, military, and high-reliability medical applications. Regulatory
  tags (RoHS, REACH, REACH SVHC) belong in a future regulatory schema field, not in
  properties — captured here in notes pending that schema work.

  Joint-level concerns (solder paste behavior, reflow temperature profile, wetting
  characteristics) attach to the solder_joint interface kind (S4-v3-5) and to the
  default_reflow_peak_temp Active Variable (Sprint 5), not to this material entry.
