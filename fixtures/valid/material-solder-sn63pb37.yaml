description: Eutectic tin-lead solder alloy, 63% tin and 37% lead by weight. The traditional electronics-assembly solder. Sharp eutectic melt at 183 C (no two-phase slushy range). Excellent wetting and forgiving thermal handling make it the long-standing choice for hand-soldering and rework. Banned in most consumer electronics under RoHS; remains in use under aerospace/military/medical exemptions and in hobbyist/repair settings.
