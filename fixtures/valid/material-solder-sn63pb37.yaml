# Valid fixture: material definition for Sn63Pb37 eutectic tin-lead solder.
# The traditional leaded electronics solder. Eutectic composition (63% tin, 37% lead by weight)
# gives a single sharp melting point at 183 C — there is no slushy two-phase range, the alloy
# transitions directly between solid and liquid.
#
# NOT RoHS compliant — contains lead. Permitted under specific RoHS exemptions
# (military, aerospace, high-reliability medical) and remains common in hobbyist/repair use
# for its lower melting point, better wetting, and forgiving handling.
#
# Alloy composition (63% Sn, 37% Pb by weight) lives in description/notes per the
# §15 deferred question on composition-by-weight as a structured field.
#
# MUST validate against definition.schema.json.
