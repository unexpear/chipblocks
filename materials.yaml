- id: carbon_film
  label: Carbon film (pyrolytic)
  category: resistive
  visual: { color: "#1a1a1a", finish: matte }
  properties:
    resistivity:
      value: 4.0e-5
      units: ohm_meter
      source:
        type: reference
        label: "Pyrolytic carbon (carbon film resistor) bulk resistivity"
        citation: "Resistor industry handbook; varies with film thickness + carbon density"
      conditions:
        temperature: { value: 20, units: degC }
      confidence: medium
      tolerance: { min: 1.0e-5, max: 1.0e-4, distribution: uniform }
      notes: "Resistance value of a real resistor is geometry-controlled — for a given resistivity, the manufacturer adjusts film thickness + helical groove to hit the target ohm value. Carbon-film resistors typically have higher 1/f noise than metal-film."
    temperature_coefficient:
      value: -500e-6
      units: per_K
      source:
        type: reference
        label: "Carbon film TCR (negative)"
        citation: "Resistor industry typical for through-hole carbon-film parts"
      confidence: medium
      tolerance: { min: -1000e-6, max: -200e-6 }
      notes: "Negative TCR — resistance decreases with temperature, opposite to metal-film. Significant for precision applications; metal-film (±100 ppm/K) is preferred where stability matters."
    density:
      value: 2100
      units: kg_per_m3
      source:
        type: reference
        label: "Pyrolytic carbon density"
        citation: "CRC Handbook of Chemistry and Physics, 102nd ed."
      confidence: medium
  notes: "The resistive material in low-cost through-hole carbon-film resistors. ~5% tolerance typical. Cheaper than metal-film but noisier + temperature-drift-prone. Metal-film (nickel-chromium) is preferred where ±1% tolerance + stability matter; carbon film is fine for non-critical loads."

- id: air
  label: Air (dry, sea-level)
  category: fluid
  visual: { color: "#ffffff", finish: transparent }
  properties:
    resistivity:
      value: 1.0e16
      units: ohm_meter
      source:
        type: reference
        label: "Dry air resistivity (effective DC)"
        citation: "CRC Handbook of Chemistry and Physics; treating air as an insulator"
      conditions:
        temperature: { value: 20, units: degC }
        relative_humidity: { value: 0, units: pct }
        pressure: { value: 101325, units: Pa }
      confidence: medium
      notes: "Air is treated as an insulator at DC. Humidity dramatically lowers effective resistivity (water absorbs onto surfaces, creates conductive paths). For PCB designs, the spacing-based dielectric is the air gap + surface contamination."
    permittivity_relative:
      value: 1.00059
      units: dimensionless
      source:
        type: standard
        label: "Air relative permittivity at standard conditions"
        citation: "NIST + ISO 2533 standard atmosphere"
      conditions:
        temperature: { value: 15, units: degC }
        pressure: { value: 101325, units: Pa }
        relative_humidity: { value: 0, units: pct }
      confidence: high
      notes: "Effectively 1.0 for most engineering calculations."
    dielectric_strength:
      value: 3.0e6
      units: V_per_m
      source:
        type: reference
        label: "Air dielectric breakdown (Paschen, at standard conditions)"
        citation: "CRC Handbook + Paschen curve standard values"
      conditions:
        temperature: { value: 20, units: degC }
        pressure: { value: 101325, units: Pa }
        relative_humidity: { value: 50, units: pct }
      confidence: medium
      tolerance: { min: 2.5e6, max: 3.5e6 }
      notes: "30 kV/cm. Paschen curve dependent — at very small gaps (<10 µm) breakdown voltage rises; in vacuum it changes again. Practical PCB designs use 50-100 V/mil for safety margin."
    thermal_conductivity:
      value: 0.026
      units: W_per_mK
      source:
        type: reference
        label: "Dry air thermal conductivity at 20 C"
        citation: "CRC Handbook of Chemistry and Physics, 102nd ed."
      conditions:
        temperature: { value: 20, units: degC }
      confidence: high
      notes: "Very low — air is a thermal insulator. Heat transfer is dominated by convection + radiation, not conduction."
    density:
      value: 1.204
      units: kg_per_m3
      source:
        type: standard
        label: "Standard air density"
        citation: "ISO 2533 standard atmosphere at 20 C sea level"
      conditions:
        temperature: { value: 20, units: degC }
        pressure: { value: 101325, units: Pa }
      confidence: high
  notes: "The default 'gap' material — used in air-gap capacitors, PCB layer spacing, free-space EM propagation reference. Properties change with altitude, humidity, and temperature; if your design operates outside controlled conditions, override these defaults."

- id: solder_sn63pb37
