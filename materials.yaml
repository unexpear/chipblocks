      value: 50
      units: W_per_mK
      source:
        type: reference
        label: "Sn63Pb37 thermal conductivity"
        citation: "ASM Handbook Vol. 6"
      confidence: medium
  notes: "Legacy leaded solder, eutectic Sn-Pb 63/37 by weight. Sharp melt at 183 °C, easier to inspect joints than lead-free. Banned in RoHS-restricted EU/UK markets for most consumer electronics since 2006; still allowed for industrial, automotive, medical, military, and aerospace. Default for hobbyist + repair work; cite SAC305 for new RoHS-compliant designs."

