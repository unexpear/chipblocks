- id: silicon_intrinsic
  label: Silicon (intrinsic, Si)
  category: semiconductor
  visual: { color: "#666666", finish: crystalline }
  properties:
    resistivity:
      value: 2300
      units: ohm_meter
      source:
        type: reference
        label: "Intrinsic silicon resistivity at 300 K"
        citation: "Sze, S.M. 'Physics of Semiconductor Devices' (3rd ed., 2007); textbook value computed from ni ~ 1.0e10 /cm^3 at 300 K with mu_n=1350, mu_p=480 cm^2/V·s"
      conditions:
        temperature: { value: 300, units: K }
      confidence: medium
      tolerance: { min: 640, max: 3400, distribution: uniform }
      notes: "Intrinsic Si resistivity is extremely sensitive to assumed intrinsic carrier concentration ni and temperature. Published values span ~640-3400 ohm·m at room temperature depending on ni model (1e10 to 1.5e10 /cm^3) and exact temperature (25-35 C). Strongly temperature-dependent — drops orders of magnitude with doping. Real devices use doped silicon (n-type / p-type), which have resistivity orders of magnitude lower and will be added as separate entries when devices.yaml needs them."
    permittivity_relative:
      value: 11.7
      units: dimensionless
      source:
        type: reference
        label: "Silicon relative permittivity"
        citation: "Sze, S.M. 'Physics of Semiconductor Devices' (3rd ed., 2007)"
      confidence: high
    band_gap:
      value: 1.12
      units: eV
      source:
        type: standard
        label: "Silicon band gap at 300 K"
        citation: "NIST"
      conditions:
        temperature: { value: 300, units: K }
      confidence: high
      notes: "Eg(T) ≈ 1.17 - 4.73e-4 * T^2 / (T + 636) eV (Varshni). 1.12 eV at 300 K, 1.17 eV at 0 K."
    density:
      value: 2329
      units: kg_per_m3
      source:
        type: reference
        label: "Crystalline silicon density"
        citation: "CRC Handbook of Chemistry and Physics, 102nd ed."
      confidence: high
    melting_point:
      value: 1687
      units: K
      source:
        type: standard
        label: "Silicon melting point"
        citation: "NIST WebBook"
      confidence: high
      notes: "1414 °C. High vs aluminum/copper — silicon survives wafer processing easily."
  notes: "Base for all silicon semiconductor devices. Intrinsic = undoped. N-doped and P-doped silicon are separate materials with different resistivity + carrier concentrations; will land as separate entries when devices.yaml needs them (Sprint 3 transistor authoring)."

- id: FR4
  label: FR4 (Flame Retardant 4)
  category: dielectric
  visual: { color: "#1a5d1a", finish: matte }
  properties:
    resistivity:
      value: 1.0e14
      units: ohm_meter
      source:
        type: standard
        label: "FR4 volume resistivity (E-glass / epoxy laminate)"
        citation: "IPC-4101/126 + typical industry datasheets"
      conditions:
        temperature: { value: 20, units: degC }
        relative_humidity: { value: 50, units: pct }
      confidence: medium
      tolerance: { min: 1.0e12, max: 1.0e15, distribution: uniform }
      notes: "Resistivity varies widely by manufacturer + glass-weave style + moisture content. Use 1e14 as a default; consult the specific datasheet for production."
    permittivity_relative:
      value: 4.4
      units: dimensionless
      source:
        type: reference
        label: "FR4 dielectric constant at 1 GHz, dry"
        citation: "IPC TM-650 typical for general-purpose FR4"
      conditions:
        frequency: { value: 1, units: GHz }
        relative_humidity: { value: 50, units: pct }
      confidence: medium
      tolerance: { min: 4.2, max: 4.7 }
      notes: "FR4's dielectric constant is frequency-dependent (drops 5-10% from 1 MHz to 10 GHz). For high-speed designs use a low-Dk laminate (Rogers, Isola I-Tera) instead."
    dielectric_strength:
      value: 2.0e7
      units: V_per_m
      source:
        type: standard
        label: "FR4 dielectric breakdown strength"
        citation: "IPC TM-650; typical 20-50 kV/mm for 1 mil thickness"
      conditions:
        temperature: { value: 20, units: degC }
      confidence: medium
      notes: "Equivalent to ~20-50 kV/mm. Practical PCB designs leave more margin (max trace voltage ~100 V for 1-mil copper-to-copper spacing)."
    thermal_conductivity:
      value: 0.3
      units: W_per_mK
      source:
        type: reference
        label: "FR4 in-plane thermal conductivity"
        citation: "IPC-TM-650"
      confidence: medium
      notes: "Through-plane is lower (~0.2 W/mK). FR4 is a poor thermal conductor; thermal vias are needed for high-power designs."
  notes: "The default PCB substrate. Glass-fiber reinforced epoxy resin. Flame-retardant grade 4 per the NEMA classification (FR-4). Standard for general-purpose 2-4 layer PCBs. Tg (glass transition) typically 130-180 °C; degrades above. For high-temp or high-frequency designs, use polyimide or PTFE-based laminates."

