# ChipBlocks materials manifest. See ADR-006 (Layer 0) + ADR-007
# (provenance fragment). Layer 0 of the 9-layer abstraction hierarchy.
#
# Each material's properties carry the full provenance fragment:
# value + units + source + conditions + confidence + tolerance + notes.
# The Sprint 2 rule applies: builtin defaults must be useful, cited,
# and condition-aware. Most material properties are temperature-
# dependent; we document the value at standard conditions (20 °C
# unless noted) and provide notes for temperature correction.
#
# Citation conventions: NIST CODATA 2018 for fundamental constants,
# IEC/IPC standards for engineering materials, ASM Handbook / CRC
# Handbook for materials data. Specific values cross-checked against
# multiple sources where practical.

- id: copper
  label: Copper (Cu)
  category: conductor
  visual: { color: "#b87333", finish: metallic }
  properties:
    resistivity:
      value: 1.68e-8
      units: ohm_meter
      source:
        type: standard
        label: "Copper resistivity at 20 C (annealed)"
        citation: "NIST CODATA 2018; IEC 60028 international annealed copper standard"
      conditions:
        temperature: { value: 20, units: degC }
      confidence: high
      tolerance: { min: 1.65e-8, max: 1.72e-8, distribution: normal }
      notes: "Temperature coefficient alpha ≈ 0.00393/K. For T != 20 C, use R(T) = R20 * (1 + alpha * (T - 20))."
    density:
      value: 8960
      units: kg_per_m3
      source:
        type: reference
        label: "Copper density at 20 C"
        citation: "CRC Handbook of Chemistry and Physics, 102nd ed."
      conditions:
        temperature: { value: 20, units: degC }
      confidence: high
    thermal_conductivity:
      value: 401
      units: W_per_mK
      source:
        type: reference
        label: "Pure copper thermal conductivity at 25 C"
        citation: "CRC Handbook of Chemistry and Physics, 102nd ed."
      conditions:
        temperature: { value: 25, units: degC }
      confidence: high
    melting_point:
      value: 1357.77
      units: K
      source:
        type: standard
        label: "Copper melting point"
        citation: "NIST WebBook"
      confidence: high
      notes: "1084.62 °C."
  notes: "The default conductor for wires, PCB traces, terminal contacts. Annealed (soft) copper is the assumption; hard-drawn copper has ~3% higher resistivity. Surface oxidation increases contact resistance over time; consider plating (tin, gold) for long-lifetime contacts."

