      value: 1.5e-7
      units: ohm_meter
      source:
        type: reference
        label: "Sn63Pb37 solder resistivity at 20 C"
        citation: "IPC J-STD-006 + tin-lead alloy data"
      conditions:
        temperature: { value: 20, units: degC }
      confidence: medium
    melting_point:
      value: 456
      units: K
      source:
        type: standard
        label: "Sn63Pb37 eutectic melting point"
        citation: "IEC 61190-1-3; ASM Handbook Vol. 6 (Welding/Brazing/Soldering)"
      confidence: high
      notes: "183 °C — a sharp eutectic melt (no plastic range). Reflow profiles target 210-220 °C peak; soldering iron tips typically 350-400 °C."
    density:
