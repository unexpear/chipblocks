# ChipBlocks shuttles manifest. See ADR-005.
#
# Each row is a fab target — either an FPGA board (kind: fpga-board) or
# an ASIC shuttle slot (kind: asic-shuttle). Today the manifest holds the
# three FPGA boards that build.py already supports plus the one ASIC slot
# tinytapeout.py supports. Future rows: cb-mini (~500x500 um) and
# cb-standard (~1 mm^2) as the in-house shuttle tiers when eFabless /
# SkyWater logistics are arranged; new FPGA boards (ECP5, MAX10) when
# motivated.
#
# Phase 0 (Sprint 25) materializes this manifest with current state and
# refactors build.py + tinytapeout.py to read from here. Behavior must
# stay byte-identical. See ADR-005 phased-migration section for detail.

- id: icestick
  label: "Lattice iCEstick"
  kind: fpga-board
  chip_family: hx1k
  fpga_package: tq144
  clock_hz: 12000000
  clock_pin: "21"
  audio_pin: "112"
  flow: yosys-nextpnr-ice40
  free_for_open_source: true
  estimated_cost_usd: 30
  adapter_path: backend/build.py
  notes: |
    iCE40HX-1k in TQ144 package. Onboard 12 MHz oscillator wired to global
    clock pin 21. Audio output goes to pad B1 (header J3 pin 1, package
    pin 112). Programmed with `iceprog` over the on-board FT2232 USB-to-
    JTAG bridge.

- id: tinyfpga-bx
  label: "TinyFPGA BX"
  kind: fpga-board
  chip_family: lp8k
  fpga_package: cm81
  clock_hz: 16000000
  clock_pin: "B2"
  audio_pin: "A2"
  flow: yosys-nextpnr-ice40
  free_for_open_source: true
  estimated_cost_usd: 40
  adapter_path: backend/build.py
  notes: |
    iCE40LP-8k in CM81 package. Onboard 16 MHz oscillator at pad B2. Audio
    output at pad A2 (GPIO connector pin 1). CM81 chipdbs use alphanumeric
    pad names (vs the numeric pin numbers of TQ144/SG48). Programmed via
    `tinyprog` (USB bootloader; no external programmer needed).

- id: icebreaker
  label: "1BitSquared iCEBreaker"
  kind: fpga-board
  chip_family: up5k
  fpga_package: sg48
  clock_hz: 12000000
  clock_pin: "35"
  audio_pin: "4"
  vga_pins:
    vga_r: "43"
    vga_g: "38"
    vga_b: "34"
    vga_hsync: "31"
    vga_vsync: "42"
  flow: yosys-nextpnr-ice40
  free_for_open_source: true
  estimated_cost_usd: 70
  adapter_path: backend/build.py
  notes: |
    iCE40UP-5k in SG48 package. Onboard 12 MHz oscillator at global clock
    pin 35. Audio output at PMOD1A pin 1 (package pin 4). VGA output
    routed to PMOD1B pins per the 1BitSquared / Digilent VGA-PMOD
    convention; pin map verified against amaranth_boards/icebreaker.py's
    PMOD1B connector string. 5280 LCs — comfortably bigger than iCEstick.

- id: tt-pico
  label: "Tiny Tapeout (Pico — 1x tile)"
  kind: asic-shuttle
  pdk: sky130A
  package: caravel-mux
  flow: openlane-tt
  area:
    width_um: 150
    height_um: 170
    transistor_budget: 25000
  tiles: 1
  clock_hz: 50000000
  top_module_prefix: "tt_um_"
  submission:
    portal: "https://app.tinytapeout.com"
    cohort: "TTGF26a"
    cohort_closes: "2026-06-22"
    notes: "TTSKY26a closed 2026-05-11; TTGF26a is the next open window."
  free_for_open_source: true
  estimated_cost_usd: 0
  adapter_path: backend/tinytapeout.py
  notes: |
    Existing Tiny Tapeout submission slot. 1x tile = ~150x170 um in
    sky130A. Designs live inside the eFabless Caravel multi-project
    pin-mux wrapper as one user-project tile. Submitted via the Tiny
    Tapeout portal; tape-out + packaging handled by the TT team.
    Open-source designs get free slots via the Open Shuttle Program.
