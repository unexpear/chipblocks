# ChipBlocks flows manifest. See ADR-005.
#
# One row per end-to-end build flow toolchain. Phase 0 has two: the
# existing iCE40 FPGA path and the existing Tiny Tapeout submission path.
# Future rows: LibreLane (sky130 successor), Yosys-only (Verilog-output
# stop), Edalize-managed flows for ECP5 / Xilinx / Intel boards.
#
# Adapter contract: each row's adapter_path module exports
# run(graph, shuttle, build_dir) -> BundleResult plus a utilization_parser
# matching the per-flow log format.

- id: yosys-nextpnr-ice40
  label: "Yosys -> nextpnr-ice40 -> icepack"
  target_kind: fpga-bitstream
  tools:
    - { name: yosys,         min_version: "0.30", license: ISC, install_hint: "apt install yosys / OSS CAD Suite" }
    - { name: nextpnr-ice40, min_version: "0.7",  license: ISC, install_hint: "apt install fpga-icestorm / OSS CAD Suite" }
    - { name: icepack,       min_version: "0.7",  license: ISC, install_hint: "apt install fpga-icestorm / OSS CAD Suite" }
  install_check: "yosys -V && nextpnr-ice40 --version && icepack -V"
  utilization_parser: backend/flows/yosys_nextpnr_ice40_parser.py
  adapter_path: backend/build.py
  notes: |
    The fully-open FPGA bitstream flow. Permissively licensed all the
    way down (ISC for yosys / nextpnr-ice40 / icepack). Existing
    build.py implementation; the utilization parser at
    backend/flows/yosys_nextpnr_ice40_parser.py is the post-Phase-0
    extraction of the ICESTORM_LC / SB_IO / SB_GB regex parsing that
    currently lives inline in build.py.

- id: openlane-tt
  label: "OpenLane (Tiny Tapeout flow)"
  target_kind: asic-submission-package
  tools:
    - { name: openlane,      min_version: "1.0", license: "Apache-2.0", install_hint: "Docker image efabless/openlane:current" }
    - { name: magic,         min_version: "8.3", license: "GPL-2.0",    install_hint: "Used at the fab side; not bundled in shipped ChipBlocks" }
  install_check: "true"
  utilization_parser: backend/flows/openlane_parser.py
  adapter_path: backend/tinytapeout.py
  pdk_compatible: [sky130A]
  notes: |
    The submission-package flow for Tiny Tapeout. Note: OpenLane invokes
    Magic (GPL-2.0) at the fab side; we never bundle or redistribute
    Magic. The submission package contains only Verilog + info.yaml +
    cocotb testbench + LICENSE; the TT team / OpenLane run Magic on
    their side after we hand off the package.
