# ChipBlocks signal types manifest. See ADR-006 (Net / port / signal model)
# + ADR-007 (Active Variables).
#
# Eight signal types covering the v1 multi-domain MVP. Each block port
# declares its signal type; the validator checks edge compatibility at
# wire-draw time. Additional signal types (rf, charge, magnetic-field,
# pressure, etc.) land as community contributions or future sprints
# when motivated.
#
# `compatible_with` lists CROSS-TYPE compatibility (a signal of type A
# connecting to a port of type B). Same-type compatibility is implicit.

- id: dc-voltage
  label: "DC voltage"
  description: "Direct-current potential difference. The most common signal in electronics for power rails, sensor outputs, control signals."
  category: electrical-dc
  units: V
  notes: "Carries a scalar voltage value. For time-varying signals use 'analog-voltage' instead. Steady-state validator computes via Kirchhoff's voltage law."

- id: dc-current
  label: "DC current"
  description: "Direct-current flow through a wire. Used where current is the primary signal (current sources, current sinks, current sense)."
  category: electrical-dc
  units: A
  notes: "Steady-state validator computes via Kirchhoff's current law at every node."

- id: analog-voltage
  label: "Analog voltage (AC / time-varying)"
  description: "Time-varying voltage signal. Audio, RF, sensor outputs at AC, op-amp internal nodes. The validator treats this as a small-signal extension of dc-voltage."
  category: electrical-ac
  units: V
  compatible_with: [dc-voltage]
  notes: "An analog-voltage port can accept a dc-voltage source (the dc-voltage is the DC bias of the analog signal). Reverse direction also allowed with a 'semantic-cross' warning style edge."

- id: digital
  label: "Digital logic (0/1)"
  description: "Single-bit Boolean logic signal. Used for gates, flip-flops, control lines between digital blocks. Voltage levels depend on the rail (3.3V, 5V, etc.)."
  category: digital
  notes: "Voltage is implicit (depends on the logic family). For a logic signal that also needs to carry voltage info, route through a dc-voltage signal type instead."

- id: ground
  label: "Ground reference"
  description: "The 0V reference for the design. Every electrical net needs exactly one ground tap to be well-defined. The validator emits an error if a sub-graph has no ground."
  category: special
  notes: "Special signal. Cannot be a source-output; only a terminal/sink. Multiple ground terminals at top-level merge to a single reference node."

- id: optical
  label: "Optical power"
  description: "Light. Used for LED outputs, photodiode inputs, fiber-optic links. Carries optical power (W) + wavelength info via parameters."
  category: optical
  units: W
  notes: "Future: split into wavelength + intensity + polarization sub-signals if needed. v1 carries scalar power; wavelength is a parameter of the emitting/receiving block."

- id: thermal
  label: "Thermal / heat flow"
  description: "Heat power flow or temperature reading. Used for thermal-management connections (heatsink interface, temperature sensor outputs, thermal pad to PCB). Carries either temperature (K) or heat flow rate (W)."
  category: thermal
  units: K
  notes: "Schema-level: a single signal type 'thermal' covers both temperature and heat-flow semantically. Block-level: ports specify which via their port name (e.g., 'temp_in', 'heat_out')."

- id: mechanical-force
  label: "Mechanical force / position"
  description: "Mechanical signal. Used for motor outputs (force / torque), switch positions (open / closed as mechanical state), actuator inputs, button presses. Carries force (N) or position (m) depending on context."
  category: mechanical
  units: N
  notes: "v1 covers DC mechanical (steady-state force / position). Time-varying mechanical (vibration, motion profiles) is a future extension."
